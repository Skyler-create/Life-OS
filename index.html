function calMaps(){
  const byDay = {}, evByDay = {}, doneBy = {};
  S.tasks.forEach(t => { if (t.due && t.bucket === 'active' && t.status !== 'done') (byDay[t.due] = byDay[t.due] || []).push(t); });
  allEvents().forEach((e, i) => { e._i = i; (evByDay[e.date] = evByDay[e.date] || []).push(e); });
  // ✓ completion markers: every done task pinned at its wall-clock finish time
  S.tasks.forEach(t => {
    if (t.status !== 'done' || !t.completed_at) return;
    const d = new Date(t.completed_at);
    const iso = d.toLocaleDateString('sv-SE');
    (doneBy[iso] = doneBy[iso] || []).push({t, min: d.getHours() * 60 + d.getMinutes(),
      hhmm: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')});
  });
  Object.values(doneBy).forEach(a => a.sort((x, y) => x.min - y.min));
  // ⏱ clocked-in work spans (blue): what you ACTUALLY worked, from focus_sessions
  const workBy = {};
  (S.focusLog || []).forEach(f => {
    const st = new Date(f.started_at);
    const en = f.ended_at ? new Date(f.ended_at) : new Date();
    if (en - st < 60e3) return;                       // <1 min: noise
    const task = f.task_id ? S.tasks.find(x => x.id === f.task_id) : null;
    const label = task ? task.title : (f.energy || 'general') + ' time';
    let cur = new Date(st);
    while (cur < en) {                                 // split spans that cross midnight
      const dayEnd = new Date(cur); dayEnd.setHours(23, 59, 59, 999);
      const stop = en < dayEnd ? en : dayEnd;
      const iso = cur.toLocaleDateString('sv-SE');
      (workBy[iso] = workBy[iso] || []).push({
        s: cur.getHours() * 60 + cur.getMinutes(),
        e: stop.getHours() * 60 + stop.getMinutes() + 1,
        label, open: !f.ended_at,

    }

}

async function gradeCard(g){
  const c = (S.cards || [])[0]; if (!c) return;
  if (S.cardMode === 'flip' && !S.earn) logAttempt(c.id, 'flip', g > 0, null, null);
  let iv = c.interval_days, ease = +c.ease, reps = c.reps, lapses = c.lapses;
  if (g === 0)      { lapses++; iv = 0; ease = Math.max(1.3, ease - 0.2); }
  else if (g === 1) { iv = iv < 1 ? 1 : Math.round(iv * ease); reps++; }
  else              { ease += 0.15; iv = Math.max(2, Math.round((iv || 1) * ease * 1.3)); reps++; }
  const d = new Date(); d.setDate(d.getDate() + iv);
  const patch = {interval_days: iv, ease, reps, lapses, due: g === 0 ? todayISO() : d.toLocaleDateString('sv-SE')};
  S.lastWrite = Date.now();
  db.rpc('lifeos_card_review', {p_id: c.id, p_grade: g}).then(({error}) => { if (error) toast('Save failed: ' + error.message); });   // same SM-2, server-side
  S.cards.shift();
  if (g === 0) S.cards.push({...c, ...patch}); // failed cards come back this session
  S.showBack = false; render();
}
async function suspendCard(){
  const c = (S.cards || [])[0]; if (!c) return;
  S.lastWrite = Date.now();
  await db.from('cards').update({suspended: true}).eq('id', c.id);
  S.cards.shift(); S.showBack = false; render(); toast('Suspended');
}

function fmt$(n){ const v = Math.abs(+n || 0); const s = v >= 1000 ? (v/1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : v.toFixed(v < 100 ? 2 : 0); return (+n < 0 ? '-$' : '$') + s; }
/* MONEY vault (2026-10-20) — server-enforced PIN. Replaces the s36 WebAuthn curtain, whose
   "tap again to enter" fallback let anyone in on a laptop without Windows Hello.
   RLS on every finance table + lifeos_money_week / lifeos_stocks_context refuse reads unless
   lifeos_money_unlock(pin) opened a 15-min window (5 wrong PINs = 15-min lockout, pushed).
   No PIN = no data, even straight from the API with your session. CHAT is gated by the same window. */
function moneyUnlockedNow(){ return S._moneyUnlockUntil && Date.now() < S._moneyUnlockUntil; }
async function unlockMoney(){
  const inp = document.getElementById('money-pin');

  const { data, error } = await db.rpc('lifeos_money_unlock', { p_pin: pin });
  if (error) { toast('Unlock failed: ' + error.message); return; }
  if (!data || !data.ok) {
    if (data && data.error === 'locked out') toast('Locked out for 15 min');
    else if (data && data.error === 'sign in first') toast('Sign in first');
    else toast('Wrong PIN' + (data && data.remaining != null ? ' (' + data.remaining + ' tries left)' : ''));
    return;
  }
  S._moneyUnlockUntil = new Date(data.until).getTime();
  toast('Money unlocked for 15 min');
  await loadAll();

}

/* money formatting: full dollars with commas for headline numbers, fmt$ (compact k) for dense rows */
function money$(n, dec){ const v = +n || 0; const a = Math.abs(v); const d = dec != null ? dec : (a < 100 && a !== 0 ? 2 : 0); return (v < 0 ? '-$' : '$') + a.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d}); }
function fmtR(n){ const v = +n || 0; return Math.abs(v) >= 1000 ? fmt$(v) : (v < 0 ? '-$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US'); }
function pctHTML(v, dec){ if (v == null || isNaN(v)) return '<span class="dim">—</span>'; const d = dec != null ? dec : 1; return `<span style="color:${v > 0 ? 'var(--done)' : v < 0 ? 'var(--accent-hi)' : 'var(--dim)'}">${v > 0 ? '+' : ''}${(+v).toFixed(d)}%</span>`; }
function deltaChip(cur, prev, invert){ if (!prev) return ''; const d = (cur - prev) / prev * 100; const good = invert ? d <= 0 : d >= 0; return `<span class="mono" style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05);text-transform:none;letter-spacing:0;color:${good ? 'var(--done)' : 'var(--accent-hi)'}" title="vs previous period">${d >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(d))}% vs prev</span>`; }

/* buckets for the trend bars: week→days, month→days, quarter→weeks, year/all→months */
function mxTrend(rows, R, per){
  const keyOf = per === 'week' || per === 'month' ? (d => d) : per === 'quarter' ? (d => { const dt = new Date(d + 'T12:00:00'); dt.setDate(dt.getDate() - (dt.getDay() + 6) % 7); return dt.toLocaleDateString('sv-SE'); }) : (d => d.slice(0, 7));
  const keys = [];
  if (per === 'week' || per === 'month') { for (let d = new Date(R.s + 'T12:00:00'); d.toLocaleDateString('sv-SE') <= R.e; d.setDate(d.getDate() + 1)) keys.push(d.toLocaleDateString('sv-SE')); }
  else if (per === 'quarter') { const d = new Date(R.s + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); for (; d.toLocaleDateString('sv-SE') <= R.e; d.setDate(d.getDate() + 7)) keys.push(d.toLocaleDateString('sv-SE')); }
  else { const d = new Date(R.s.slice(0, 7) + '-15T12:00:00'); const endK = R.e.slice(0, 7); for (; d.toLocaleDateString('sv-SE').slice(0, 7) <= endK; d.setMonth(d.getMonth() + 1)) keys.push(d.toLocaleDateString('sv-SE').slice(0, 7)); }
  const cats = mxGroup(rows, 'cat').slice(0, 6).map(c => c.k);
  const per_ = {}; keys.forEach(k => per_[k] = {});
  rows.forEach(t => { const k = keyOf(t.posted); if (!per_[k]) return; const c = cats.includes(t.category || 'uncategorized') ? (t.category || 'uncategorized') : '_other'; per_[k][c] = (per_[k][c] || 0) + mxAmt(t); });
  const today = todayISO();
  const lblEvery = per === 'month' ? 5 : per === 'quarter' ? 2 : 1;
  const lbl = (k, i) => { if (i % lblEvery && i !== keys.length - 1) return ''; if (per === 'week') return new Date(k + 'T12:00:00').toLocaleDateString('en-US', {weekday: 'narrow'}); if (per === 'month') return String(+k.slice(8)); if (per === 'quarter') return mDateLbl(k).replace(' ', ' '); return new Date(k + '-15T12:00:00').toLocaleDateString('en-US', {month: 'short'}).slice(0, 1); };
  return {keys, cats, rows: keys.map((k, i) => ({label: lbl(k, i), hot: keyOf(today) === k, parts: cats.concat('_other').map(c => ({v: per_[k][c] || 0, color: c === '_other' ? '#4B5563' : mcatColor(c), title: `${k} ${c === '_other' ? 'everything else' : c}: ${money$(per_[k][c] || 0)}`}))}))};
}

async function editHolding(tk){
  const r = (S.stocks && S.stocks.tickers || []).find(h => h.ticker === tk); if (!r) return;
  const sh = prompt(tk + ' shares', r.shares); if (sh == null || isNaN(parseFloat(sh))) return;
  const cb = prompt(tk + ' avg cost per share', r.cost_basis); if (cb == null || isNaN(parseFloat(cb))) return;
  S.lastWrite = Date.now();
  const {error} = await db.from('holdings').update({shares: parseFloat(sh), cost_basis: parseFloat(cb), est_shares: false}).eq('ticker', tk);
  if (error) { toast('⚠ ' + error.message); return; }
  toast('✓ ' + tk + ' updated'); loadAll();
}
async function ackTrade(key){
  S.lastWrite = Date.now();
  const {error} = await db.from('stock_trade_acks').insert({key});
  if (error) { toast('⚠ ' + error.message); return; }
  toast('dismissed'); loadAll();
}
async function addHolding(){
  const tk = (document.getElementById('h-tk')?.value || '').trim().toUpperCase();
  if (!/^[A-Z.\-]{1,8}$/.test(tk)) { toast('ticker?'); return; }
  const sh = parseFloat(document.getElementById('h-sh')?.value) || 0;
  const cb = parseFloat(document.getElementById('h-cb')?.value) || null;
  S.lastWrite = Date.now();
  const {error} = await db.from('holdings').upsert({ticker: tk, shares: sh, cost_basis: cb});
  if (error) { toast('⚠ ' + error.message); return; }
  await db.rpc('lifeos_stocks_sync');   // pull history for the new ticker now
  toast('✓ ' + tk + ' — history syncing');
  setTimeout(() => { if (!uiBusy()) loadAll(); else S._dirty = true; }, 12000);
  loadAll();
}
async function addWatch(){
  const tk = (document.getElementById('w-tk')?.value || '').trim().toUpperCase();
  if (!/^[A-Z.\-]{1,8}$/.test(tk)) { toast('ticker?'); return; }
  S.lastWrite = Date.now();
  await db.from('watch_tickers').upsert({ticker: tk});
  await db.rpc('lifeos_stocks_sync');
  toast('✓ watching ' + tk);
  setTimeout(() => { if (!uiBusy()) loadAll(); else S._dirty = true; }, 12000);
  loadAll();
}
async function delTicker(tk, role){
  if (!confirm('Remove ' + tk + '?')) return;
  S.lastWrite = Date.now();
  await db.from(role === 'holding' ? 'holdings' : 'watch_tickers').delete().eq('ticker', tk);
  loadAll();
}
async function recatTx(accountId, txId, cat){
  S.txEdit = null;
  if (!cat) { render(); return; }
  S.lastWrite = Date.now();
  const tx = S.finTx.find(t => t.account_id === accountId && t.tx_id === txId);
  await db.from('fin_transactions').update({category: cat, category_src: 'manual'})
    .eq('account_id', accountId).eq('tx_id', txId);
  if (tx && (tx.payee || tx.description)) {
    await db.from('fin_rules').insert({pattern: (tx.payee || tx.description), category: cat, priority: 50});
  }
  if (tx) tx.category = cat;
  toast('✓ ' + cat + ' — rule saved');
  render();
}
async function ignoreRecurring(payee){
  S.lastWrite = Date.now();
  await db.from('fin_recurring').update({ignored: true}).eq('payee', payee);
  S.finRecurring = S.finRecurring.filter(r => r.payee !== payee);
  toast('ignored');
  render();
}

async function addPerson(){
  const g = id => document.getElementById(id)?.value?.trim() || '';
  const md = g('pp-md').match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if (!g('pp-name') || !md) { toast('need a name + MM/DD'); return; }

    month: +md[1], day: +md[2], lead_days: parseInt(g('pp-lead')) || 14});

/* =========================================================================
   JOBS — Slipstream job pipeline (spec 06). Postings flow in from the
   Slipstream push script; daily apply-tasks are created server-side
   (lifeos_jobs_daily, 5:30 AM ET). This view is the pipeline board: status

const JOB_NEXT = {new:'interested', interested:'applied', applied:'interviewing', interviewing:'offer'};
const JOB_ICON = {new:'✨', interested:'👀', applied:'📨', interviewing:'🎤', offer:'🏆', rejected:'✖'};

function rJobs(){

    </div>`;
  }
  if (!S.jobsView) S.jobsView = localStorage.getItem('jobsView') || 'pipeline';
  const seg = `<div class="seg" style="display:flex;margin-bottom:10px">${[['pipeline','PIPELINE'],['stats','STATS']].map(([v, l]) =>
    `<button class="${S.jobsView === v ? 'on' : ''}" style="flex:1" onclick="S.jobsView='${v}';localStorage.setItem('jobsView','${v}');render()">${l}</button>`).join('')}</div>`;
  return seg + (S.jobsView === 'stats' ? jobsStatsHTML() : jobsPipelineHTML());

function jobsPipelineHTML(){
  const groups = [
    ['INTERESTED (task + kit)', S.jobs.filter(j => j.status === 'interested')],
    ['NEW · top picks by rank', S.jobs.filter(j => j.status === 'new').sort((a, b) => (b.rank_score || 0) - (a.rank_score || 0)).slice(0, S.jobsMore ? 60 : 15)],
    ['APPLIED',      S.jobs.filter(j => j.status === 'applied')],
    ['INTERVIEWING', S.jobs.filter(j => j.status === 'interviewing')],
    ['OFFER',        S.jobs.filter(j => j.status === 'offer')],
    ['REJECTED',     S.jobs.filter(j => j.status === 'rejected')],

    `<div class="card"><div class="dim" style="font-size:10px;letter-spacing:.08em;margin-bottom:4px">${JOB_ICON[label.split(' ')[0].toLowerCase()] || ''} ${label} · ${rows.length}</div>${rows.map(jobRowHTML).join('')}${label.startsWith('NEW') ? more : ''}</div>`).join('');

function jobsStatsHTML(){
  const counts = {};
  S.jobs.forEach(j => counts[j.status] = (counts[j.status] || 0) + 1);
  const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString();
  const appliedish = S.jobs.filter(j => ['applied','interviewing','offer'].includes(j.status));
  const thisWeek = appliedish.filter(j => (j.status_changed_at || '') >= weekAgo).length;
  const target = (parseInt(S.settings && S.settings.jobs_daily_target || '2', 10) || 2) * 7;
  const days = appliedish
    .map(j => (new Date(j.status_changed_at) - new Date(j.found_at)) / 864e5)
    .filter(d => isFinite(d) && d >= 0);
  const avgDays = days.length ? (days.reduce((a, b) => a + b, 0) / days.length).toFixed(1) : null;
  return `<div class="card">
      <div class="dim" style="font-size:10px;letter-spacing:.08em;margin-bottom:6px">PIPELINE COUNTS</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${['new','interested','applied','interviewing','offer','rejected'].map(s =>
        `<div style="flex:1;min-width:70px;text-align:center;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.04)">
           <div style="font-size:16px;font-weight:700">${counts[s] || 0}</div>
           <div class="dim" style="font-size:9px">${JOB_ICON[s]} ${s}</div></div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="dim" style="font-size:10px;letter-spacing:.08em;margin-bottom:6px">VELOCITY</div>
      <div style="font-size:12px;line-height:1.9">
        Applications this week: <b>${thisWeek}</b> <span class="dim">/ ${target} target</span><br>
        ${avgDays != null ? `Avg days found → applied: <b>≈${avgDays}</b> <span class="dim">(from last status change)</span><br>` : ''}
        Total tracked: <b>${S.jobs.length}</b> <span class="dim">(archived hidden)</span>
      </div>
    </div>`;
}

async function jobPick(id){

  const title = 'Apply: ' + j.title + (j.company ? ' @ ' + j.company : '');

async function renameProject(idx){
  const oldName = distinctProjects()[idx]; if (!oldName) return;
  const name = (prompt(`Rename "${oldName}" to:`, oldName) || '').trim();
  if (!name || name === oldName) return;
  if (distinctProjects().some(p => p.toLowerCase() === name.toLowerCase())) { toast('That name already exists'); return; }
  S.lastWrite = Date.now();
  const {error} = await db.from('tasks').update({project: name}).eq('project', oldName);  // cascades to ALL its tasks incl. done
  if (error) { toast('Rename failed: ' + error.message); return; }
  const reg = projectRegistry().filter(p => p !== oldName); reg.push(name);
  await db.from('lifeos_settings').upsert({key: 'projects', value: JSON.stringify(reg)});
  toast(`Renamed → ${name}`); loadAll();
}
async function addProject(){
  const inp = document.getElementById('newproj');
  const name = (inp?.value || '').trim();
  if (!name) return;
  if (distinctProjects().some(p => p.toLowerCase() === name.toLowerCase())) { toast('Project already exists'); return; }
  const reg = projectRegistry(); reg.push(name);
  const {error} = await db.from('lifeos_settings').upsert({key: 'projects', value: JSON.stringify(reg)});
  if (error) { toast('Save failed: ' + error.message); return; }
  toast('Project added: ' + name); loadAll();
}
async function deleteProject(idx){
  const name = distinctProjects()[idx]; if (!name) return;
  const open = S.tasks.filter(t => t.project === name && t.status !== 'done').length;
  if (!confirm(open
    ? `Delete "${name}"? Its ${open} open task${open === 1 ? '' : 's'} move to Inbox.`
    : `Delete "${name}"?`)) return;
  S.lastWrite = Date.now();
  if (open) {
    const {error} = await db.from('tasks').update({project: null}).eq('project', name).neq('status', 'done');
    if (error) { toast('Delete failed: ' + error.message); return; }
  }
  const reg = projectRegistry().filter(p => p !== name);
  await db.from('lifeos_settings').upsert({key: 'projects', value: JSON.stringify(reg)});
  toast('Project deleted: ' + name); loadAll();
}

function mtRowHTML(t, child){

function mtListHTML(){
  const q = (S.mtFilter || '').trim().toLowerCase();
  const all = S.tasks || [];
  const kids = {};
  all.forEach(t => { if (t.parent_id) (kids[t.parent_id] = kids[t.parent_id] || []).push(t); });
  const hit = t => !q || (t.title || '').toLowerCase().includes(q) || (t.project || '').toLowerCase().includes(q);
  const tops = all.filter(t => !t.parent_id).filter(t => hit(t) || (kids[t.id] || []).some(hit));   // family matches if goal OR any chunk does
  if (!tops.length) return '<div class="dim" style="font-size:12px;margin-top:8px">No matching tasks.</div>';
  const CAP = 60;
  let out = tops.slice(0, CAP).map(t =>
    mtRowHTML(t, false) + (kids[t.id] || []).map(c => mtRowHTML(c, true)).join('')).join('');
  if (tops.length > CAP) out += `<div class="dim" style="font-size:11px;margin-top:8px">…${tops.length - CAP} more — narrow the filter.</div>`;
  return out;
}
async function mtDelete(id){
  const t = (S.tasks || []).find(x => x.id === id); if (!t) return;
  const kids = (S.tasks || []).filter(x => x.parent_id === id);
  if (kids.length) {
    if (!confirm(`Delete goal "${t.title}" + its ${kids.length} chunk${kids.length === 1 ? '' : 's'}?`)) return;
    S.lastWrite = Date.now();
    const {error: ce} = await db.from('tasks').delete().eq('parent_id', id);   // children first
    if (ce) { toast('Delete failed: ' + ce.message); return; }
  } else if (!confirm(`Delete "${t.title}"?`)) return;
  S.lastWrite = Date.now();
  const {error} = await db.from('tasks').delete().eq('id', id);
  if (error) { toast('Delete failed: ' + error.message); return; }
  if (!kids.length && t.parent_id) {   // last chunk gone → parent becomes a plain task again
    const {data: sibs} = await db.from('tasks').select('id').eq('parent_id', t.parent_id);
    if (!sibs || !sibs.length) await db.from('tasks').update({chunk_total: null}).eq('id', t.parent_id);
  }
  toast('Deleted: ' + (t.title || 'task'));
  loadAll();
}

   Server owns every number: lifeos_caffeine_context() -> S.caff (loaded in loadAll),
   lifeos_log_caffeine(preset, ts, secret, bag) writes. This file only renders.

function caffTz(){ return (S.settings && S.settings.tz) || 'America/Chicago'; }
function caffClockNow(){ return new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZone: caffTz()}); }

const caffMinsOf = clk => { const [h, m] = clk.split(':').map(Number); return h * 60 + m; };
const ROAST_COLOR = {resting:'#4ADE80', ok:'var(--dim)', aging:'#FBBF24', stale:'#E1251B'};

/* SVG curve: 15-min samples 00:00..24:00, threshold line, bedtime + now markers, log dots */
function caffCurveSVG(h, big){
  const c = S.caff; if (!c) return '';
  const pts = c.curve || []; if (!pts.length) return '';
  const W = 600, H = h, padT = big ? 14 : 4, padB = big ? 16 : 2;
  const maxMg = Math.max(c.threshold * 2, c.ceiling * 0.6, ...pts.map(p => +p.mg)) * 1.08;
  const x = m => (m / 1440) * W;
  const y = mg => padT + (H - padT - padB) * (1 - mg / maxMg);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(caffMinsOf(p.clock)).toFixed(1) + ',' + y(+p.mg).toFixed(1)).join(' ');
  const nowM = caffMinsOf(caffClockNow());
  const bedM = caffMinsOf(c.bed_clock);
  const bedX = bedM < 360 ? W + 1 : x(bedM);                 // after-midnight bedtime sits off the right edge
  const over = +c.bed_level > +c.threshold;
  const dots = (c.logs || []).map(l => `<circle cx="${x(caffMinsOf(l.clock)).toFixed(1)}" cy="${y(0)}" r="${big ? 4 : 2.5}" fill="#C4B5FD"><title>${esc(l.label)} · ${l.mg} mg · ${l.clock}</title></circle>`).join('');
  const ticks = big ? [6, 12, 18].map(hh => `<text x="${x(hh * 60)}" y="${H - 3}" fill="var(--dim)" font-size="10" font-family="var(--mono)" text-anchor="middle">${hh}:00</text>`).join('') : '';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">
    <line x1="0" x2="${W}" y1="${y(c.threshold)}" y2="${y(c.threshold)}" stroke="${over ? '#E1251B' : 'var(--dim)'}" stroke-dasharray="4 4" stroke-width="1" opacity=".7"/>
    ${big ? `<text x="4" y="${y(c.threshold) - 3}" fill="var(--dim)" font-size="10" font-family="var(--mono)">${c.threshold} mg bed threshold</text>` : ''}
    <path d="${path}" fill="none" stroke="#C4B5FD" stroke-width="${big ? 2 : 1.5}"/>
    <path d="${path} L${W},${y(0)} L0,${y(0)} Z" fill="#C4B5FD" opacity=".08"/>
    <line x1="${x(nowM)}" x2="${x(nowM)}" y1="${padT}" y2="${H - padB}" stroke="#38BDF8" stroke-width="1"/>
    ${bedX <= W ? `<line x1="${bedX}" x2="${bedX}" y1="${padT}" y2="${H - padB}" stroke="${over ? '#E1251B' : '#FBBF24'}" stroke-width="1.5"/>` : ''}
    ${big && bedX <= W ? `<text x="${bedX - 3}" y="${padT + 9}" fill="${over ? '#E1251B' : '#FBBF24'}" font-size="10" font-family="var(--mono)" text-anchor="end">bed ${c.bed_clock}</text>` : ''}
    ${dots}${ticks}</svg>`;
}
/* quick-log row: [↺ again: last drink] + one chip per method → opens the picker sheet.
   Picker = one sheet, sections reveal top-down: method → variant → size → bag → when → sip window.
   Every section is preselected from the last log of that method, so the common case is
   method-tap + Log (2 taps); "↺ again" is 1 tap. */
const CAFF_METHOD_LABEL = {espresso: 'Espresso', cold_brew: 'Cold brew', drip: 'Drip', japanese_iced: 'Japanese iced', phin: 'Phin', other: 'Other'};
const CAFF_F = {arabica: 11, robusta: 22, half_caf: 5.5, decaf: 0.33};
/* mirrors lifeos_log_caffeine: preset mg is authoritative; a bag scales it by bean type.
   half-caf presets = half of THIS bag + half decaf; decaf presets stay decaf whatever the bag. */
function caffMg(p, bag, scale){
  let mg = +p.mg;
  if (bag) {
    if (p.bean === 'half_caf') mg = mg * CAFF_F[bag.bean_type] / CAFF_F.arabica;
    else if (p.bean !== 'decaf') mg = mg * CAFF_F[bag.bean_type] / CAFF_F[p.bean];
  }
  return Math.round(mg * (scale || 1) * 10) / 10;
}
function caffMethods(){ const seen = []; (S.caff?.presets || []).forEach(p => { if (!seen.includes(p.method)) seen.push(p.method); }); return seen; }
function caffChipsHTML(){
  const c = S.caff; if (!c) return '';
  const ll = c.last_log;
  const again = ll && ll.slug ? `<button class="schip" style="border-color:#C4B5FD;color:#C4B5FD" onclick="logCaffAgain()">↺ ${esc(ll.label.replace(/ \(.*\)$/, ''))}${ll.bag ? ' · ' + esc(ll.bag.split(' ')[0]) : ''} · ${Math.round(ll.mg)}</button>` : '';
  return `<div class="chiprow" style="margin-top:8px">${again}${caffMethods().map(m =>
    `<button class="schip" onclick="openCaffPicker('${m}')">${CAFF_METHOD_LABEL[m] || m}</button>`).join('')}</div>`;
}
function openCaffPicker(method){
  const c = S.caff; const last = (c.last_by_method || {})[method] || {};
  const presets = c.presets.filter(p => p.method === method);
  const p = presets.find(x => x.slug === last.slug) || presets[0];
  const bagId = last.bean_id || c.last_bag_id || null;
  S.caffPick = {method, slug: p.slug, bag: bagId, oz: p.serving_oz, startMin: 0, sipMin: 0, custom: null};
  render();
}
function caffPickSet(k, v){ if (!S.caffPick) return; S.caffPick[k] = v; if (k === 'slug') { const p = S.caff.presets.find(x => x.slug === v); S.caffPick.oz = p.serving_oz; } render(); }
/* the two typed fields (oz, custom time) update state + the header/button text only — no rebuild while
   the iOS keyboard/wheel is up (a rebuild under a focused input is what left the sheet "stuck") */
function caffPickPatch(){
  const pk = S.caffPick; if (!pk) return;
  const presets = S.caff.presets.filter(p => p.method === pk.method);
  const p = presets.find(x => x.slug === pk.slug) || presets[0];
  const bag = caffBag(pk.bag), scale = p.serving_oz && pk.oz ? pk.oz / p.serving_oz : 1, mg = caffMg(p, bag, scale);
  const t0 = caffPickStart(); const t1 = pk.sipMin ? new Date(+t0 + pk.sipMin * 60000) : null;
  const fmt = d => d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  const h = document.getElementById('cp-mg'); if (h) h.textContent = `· ${mg} mg${bag ? ' · ' + bag.label : ''}`;
  const b = document.getElementById('cp-log'); if (b) b.textContent = `Log ${mg} mg · ${fmt(t0)}${t1 ? '–' + fmt(t1) : ''}`;
}
function caffPickOz(v, dflt){ if (!S.caffPick) return; S.caffPick.oz = +v || dflt; caffPickPatch(); }
function caffPickSip(v){   // free-typed sip duration (chips max out at 120) — no rebuild while typing
  if (!S.caffPick) return; S.caffPick.sipMin = Math.max(0, Math.round(+v || 0));
  document.querySelectorAll('#sheetroot .cp-sip').forEach(el => el.classList.remove('on'));
  caffPickPatch();
}
function caffPickTime(){   // custom start from the time input
  const v = document.getElementById('cp-time')?.value; if (!v || !S.caffPick) return;
  const now = new Date(); const [h, m] = v.split(':').map(Number);
  const d = new Date(now); d.setHours(h, m, 0, 0); if (d > now) d.setDate(d.getDate() - 1);
  S.caffPick.custom = d.toISOString(); S.caffPick.startMin = null;
  document.querySelectorAll('#sheetroot .cp-start').forEach(el => el.classList.remove('on'));

  };
  const svg = rows.length > 1 ? `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block;margin:6px 0">

        <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.additions || '')} ${esc(r.notes || '')}">${esc(bagOf(r))}</td>
        <td>${r.method.replace('_', ' ')}</td><td>${r.dose_g}</td><td>${r.grind_clicks ?? ''}</td>
        <td>${r.output_g ?? '–'}/${r.time_s ?? '–'}</td>
        <td>${r.days_post_roast != null ? `<span style="color:${ROAST_COLOR[r.roast_bucket] || 'var(--dim)'}">${r.days_post_roast}d</span>` : ''}</td>
        <td>${r.logged_caffeine ? '✓' : ''}</td>
        <td><button class="btn" style="padding:1px 7px;font-size:10px" onclick="openBrewForm('${r.id}')">✎</button></td></tr>`).join('')}
    </table></div>
  </div>`;
}
function openBrewForm(id){
  const src = id ? (S.brews || []).find(r => r.id === id) : (S.brews || [])[0];
  if (id && !src) { toast('that brew is not loaded — refresh'); return; }
  const base = src ? {method: src.method, bean_id: src.bean_id, beans: src.bean_id ? '' : src.beans, dose_g: src.dose_g, grind_clicks: src.grind_clicks, grinder: src.grinder,
      temp_c: src.temp_c, water_ml: src.water_ml, preinfusion: src.preinfusion}
    : {method: 'espresso', bean_id: caffCurBag(), dose_g: 16, grinder: 'k6', temp_c: 92, water_ml: 65};
  // additions always start from the house defaults (2026-09-29): 5 g sugar · 5 g caramel · 100 ml milk · 2 ice
  Object.assign(base, {sugar_g: 5, caramel_g: 5, milk_g: 100, ice_n: 2});
  S.brewEdit = id ? Object.assign({}, src, {id}) : Object.assign(base, {output_g: null, time_s: null, plain_taste: null, rating: null, notes: '', logged_caffeine: false});
  render();
  setTimeout(() => document.getElementById('bf-dose_g')?.scrollIntoView({block: 'center', behavior: 'smooth'}), 80);   // id was 'bf-dose' — never matched, the form never scrolled into view
}
function brewFormHTML(){
  const b = S.brewEdit; const bag = caffBag(b.bean_id);
  const noGrinder = bag && bag.pre_ground, noK6 = bag && bag.flavored;
  if (noGrinder && b.grinder) b.grinder = null; if (noK6 && b.grinder === 'k6') b.grinder = 'oxo';
  const chips = (k, opts, fmt) => `<div class="chiprow">${opts.map(o => `<button class="schip ${b[k] === o ? 'on' : ''}" onclick="S.brewEdit.${k}=${o === null ? 'null' : "'" + o + "'"};render()">${(fmt || (x => x))(o)}</button>`).join('')}</div>`;
  const num = (k, label, step) => `<div><label>${label}</label><input id="bf-${k}" type="number" inputmode="decimal" step="${step || 1}" value="${b[k] ?? ''}" oninput="S.brewEdit.${k}=this.value===''?null:+this.value"></div>`;
  // Pixa line: only two marks get used — a two-way toggle beats a number box
  const pixa = b.method === 'cold_brew' ? num('water_ml', 'Water ml')
    : `<div><label>Pixa line ml</label><div class="chiprow">${[65, 80].map(v => `<button class="schip ${+b.water_ml === v ? 'on' : ''}" onclick="S.brewEdit.water_ml=${v};render()">${v}</button>`).join('')}</div></div>`;
  const grinderRow = noGrinder
    ? `<div class="dim" style="font-family:var(--mono);font-size:11px;color:var(--accent)">🚫 ${esc(bag.label)} is pre-ground — no grinder</div>`
    : `<div class="chiprow">${['k6', 'oxo'].map(g => noK6 && g === 'k6'
        ? `<button class="schip" style="opacity:.4;text-decoration:line-through" data-m="${esc(bag.label)} is flavored — K6 stays clean" onclick="toast(this.dataset.m)">k6</button>`
        : `<button class="schip ${b.grinder === g ? 'on' : ''}" onclick="S.brewEdit.grinder='${g}';render()">${g}</button>`).join('')}
        ${noK6 ? `<span class="dim" style="font-family:var(--mono);font-size:10px;align-self:center">flavored → no K6</span>` : ''}</div>`;
  return `<div class="noswipe" style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px">
    <label class="dim" style="font-family:var(--mono);font-size:10px;text-transform:uppercase">Method</label>
    ${chips('method', ['espresso', 'cold_brew', 'drip'], x => x.replace('_', ' '))}
    <label class="dim" style="font-family:var(--mono);font-size:10px;text-transform:uppercase;display:block;margin-top:8px">Bag</label>
    <div class="chiprow">${(S.caff.bags || []).map(g => `<button class="schip ${b.bean_id === g.id ? 'on' : ''}" onclick="S.brewEdit.bean_id='${g.id}';S.brewEdit.beans='';render()">${esc(g.label)}</button>`).join('')}
      <button class="schip ${!b.bean_id ? 'on' : ''}" onclick="S.brewEdit.bean_id=null;render()">other…</button></div>
    ${!b.bean_id ? `<input id="bf-beans" placeholder="bean name (one-off)" value="${esc(b.beans || '')}" style="margin-top:6px" oninput="S.brewEdit.beans=this.value">` : ''}
    <label class="dim" style="font-family:var(--mono);font-size:10px;text-transform:uppercase;display:block;margin-top:8px">Grinder</label>
    ${grinderRow}
    <div class="metric-grid" style="margin-top:8px">
      ${num('dose_g', 'Dose g', 0.1)}${noGrinder ? '' : num('grind_clicks', 'Clicks')}${num('temp_c', '°C')}${pixa}
      ${num('output_g', 'Output g', 0.1)}${num('time_s', 'Time s')}
    </div>
    <label class="dim" style="font-family:var(--mono);font-size:10px;text-transform:uppercase;display:block;margin-top:8px">Additions</label>
    <div class="metric-grid" style="grid-template-columns:1fr 1fr 1fr 1fr">
      ${num('sugar_g', 'Sugar g', 0.5)}${num('caramel_g', 'Caramel g', 0.5)}${num('milk_g', 'Milk ml', 5)}${num('ice_n', 'Ice', 1)}
      <div class="full"><label>Notes</label><input id="bf-notes" value="${esc(b.notes || '')}" oninput="S.brewEdit.notes=this.value"></div>
    </div>
    <label class="dim" style="font-family:var(--mono);font-size:10px;text-transform:uppercase;display:block;margin-top:8px">Plain taste (before milk/sugar)</label>
    ${chips('plain_taste', ['sour', 'balanced', 'bitter', 'flat', null], x => x || '—')}
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <span class="dim" style="font-family:var(--mono);font-size:10px">RATING</span>
      ${[1, 2, 3, 4, 5].map(n => `<button class="schip ${b.rating === n ? 'on' : ''}" style="padding:5px 9px" onclick="S.brewEdit.rating=${b.rating === n ? 'null' : n};render()">${n}</button>`).join('')}
      <button class="schip ${b.preinfusion ? 'on' : ''}" style="margin-left:auto" onclick="S.brewEdit.preinfusion=!S.brewEdit.preinfusion;render()">preinfusion</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <button class="schip ${b.logged_caffeine ? 'on' : ''}" style="border-color:#C4B5FD;${b.logged_caffeine ? '' : 'color:#C4B5FD'}" onclick="S.brewEdit.logged_caffeine=!S.brewEdit.logged_caffeine;render()">☕ I drank this</button>
      <span style="flex:1"></span>
      <button class="btn" onclick="S.brewEdit=null;render()">cancel</button>
      <button class="btn primary" style="white-space:nowrap" onclick="saveBrew()">${b.id ? 'Save' : 'Log brew'}</button>
    </div>
  </div>`;
}
async function saveBrew(){
  const b = S.brewEdit; const g = k => document.getElementById('bf-' + k)?.value ?? '';
  const n = k => g(k) === '' ? null : +g(k);
  const row = {method: b.method, bean_id: b.bean_id || null, beans: b.bean_id ? null : (g('beans').trim() || null),
    dose_g: n('dose_g'), grind_clicks: n('grind_clicks'), grinder: b.grinder || null, temp_c: n('temp_c'),
    water_ml: b.method === 'cold_brew' ? n('water_ml') : (b.water_ml ?? null),
    output_g: n('output_g'), time_s: n('time_s'), preinfusion: b.preinfusion ?? null, plain_taste: b.plain_taste || null,
    sugar_g: n('sugar_g'), caramel_g: n('caramel_g'), milk_g: n('milk_g'), ice_n: n('ice_n'),
    rating: b.rating || null, notes: g('notes').trim() || null, logged_caffeine: !!b.logged_caffeine};
  row.additions = [row.sugar_g ? row.sugar_g + 'g sugar' : '', row.caramel_g ? row.caramel_g + 'g caramel' : '', row.milk_g ? row.milk_g + 'ml milk' : '', row.ice_n ? row.ice_n + ' ice' : ''].filter(Boolean).join(', ') || null;
  if (!row.dose_g) { toast('dose?'); return; }
  if (!row.bean_id && !row.beans) { toast('pick a bag or name the beans'); return; }
  const q = b.id ? db.from('brew_log').update(row).eq('id', b.id) : db.from('brew_log').insert(row);
  const {error} = await q;
  if (error) { toast('❌ ' + error.message.replace(/^.*?: /, '')); return; }
  S.brewEdit = null; toast(row.logged_caffeine ? '☕ logged + counted' : '📝 logged'); render(); loadCoffee();
}
/* reflection: one line, warning variant if over threshold */
function caffReflectLine(){
  const c = S.caff; if (!c) return '';
  const over = +c.bed_level > +c.threshold;
  return `<div class="full" style="font-family:var(--mono);font-size:11px;${over ? 'color:var(--accent)' : 'color:var(--dim)'}">☕ Caffeine at bedtime (${c.bed_clock}): ~${Math.round(c.bed_level)} mg${over ? ' — over your ' + c.threshold + ' mg threshold' : ''} · ${Math.round(c.today_mg)} mg today</div>`;
}

/* ================= SLEEP (2026-09-22) =================
   Bed = the phone's last app-close of the night (Shortcut → lifeos_log_sleep), wake = the
   ranked confirmation (up > app > challenge > alarm > override). lifeos_sleep_nights() does
   the pairing; this only draws. */
function sleepNightsCardHTML(){
  const nights = (S.sleepNights || []).slice(-7); const st = S.sleepStats || {};   // past week only (Skyler, 10-16)
  const need = +st.need_min || 480;
  const last = nights[nights.length - 1] || null;
  const withDur = nights.filter(n => n.dur_min);
  const fmtH = m => m == null ? '—' : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;
  const stat = (v, label, color, sub) => VIZ.tile(v, label, {color: color || undefined, colored: !!color, sub});
  const durColor = m => m == null ? 'var(--card2)' : m >= need - 30 ? '#4ADE80' : m >= need - 90 ? '#FBBF24' : '#E1251B';
  // Chart: hours on the Y axis (gridline every 2 h), the duration written on top of every bar, dashed "need" line.
  // Uniform scaling (no preserveAspectRatio=none) so the text isn't stretched on wide screens.
  const W = 360, H = 104, L = 24, TOP = 12, BOT = 12;
  const plotH = H - TOP - BOT, plotW = W - L;
  const maxM = Math.ceil(Math.max(need + 60, ...withDur.map(n => n.dur_min)) / 120) * 120;   // top of axis = next even hour
  const yOf = m => TOP + plotH - (m / maxM) * plotH;
  const bw = plotW / Math.max(nights.length, 1);
  const grid = [];
  for (let m = 120; m <= maxM; m += 120) grid.push(`<line x1="${L}" x2="${W}" y1="${yOf(m).toFixed(1)}" y2="${yOf(m).toFixed(1)}" stroke="var(--line)" opacity=".5"/>
    <text x="${L - 4}" y="${(yOf(m) + 3).toFixed(1)}" fill="${Math.abs(m - need) < 60 ? 'var(--focus)' : 'var(--dim)'}" font-size="8" font-family="var(--mono)" text-anchor="end">${m / 60}h</text>`);
  const bars = nights.map((n, i) => {
    const h = n.dur_min ? (n.dur_min / maxM) * plotH : 2;
    const x = L + i * bw, y = TOP + plotH - h;
    const d = new Date(n.date + 'T12:00:00');
    const lbl = n.dur_min ? (bw >= 22 ? fmtH(n.dur_min) : (n.dur_min / 60).toFixed(1)) : '';
    const stg = n.source === 'fitbit' && n.deep != null ? ` · deep ${n.deep}m REM ${n.rem}m awake ${n.awake}m` : '';
    return `<rect x="${(x + 2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${durColor(n.dur_min)}" opacity="${n.dur_min ? .9 : .5}"${n.source === 'fitbit' ? ' stroke="var(--text)" stroke-opacity=".35" stroke-width=".8"' : ''}><title>${n.date}: ${n.bed || '?'} → ${n.wake || '?'} ${n.dur_min ? '· ' + fmtH(n.dur_min) + (n.source === 'fitbit' ? ' asleep (Fitbit)' : ' in bed (phone)') : '· no bedtime logged'}${stg}</title></rect>
      ${lbl ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 2).toFixed(1)}" fill="var(--text)" font-size="7.5" font-family="var(--mono)" text-anchor="middle">${lbl}</text>` : ''}
      <text x="${(x + bw / 2).toFixed(1)}" y="${H - 2}" fill="var(--dim)" font-size="8" font-family="var(--mono)" text-anchor="middle">${'SMTWTFS'[d.getDay()]}</text>`;
  }).join('');
  const needY = yOf(need);
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin:6px 0 2px">
    ${grid.join('')}
    <line x1="${L}" x2="${W}" y1="${needY.toFixed(1)}" y2="${needY.toFixed(1)}" stroke="var(--focus)" stroke-dasharray="4 4" opacity=".7"/>
    ${bars}</svg>`;
  const tier = S.credits?.sleep_tier;
  const tierLine = withDur.length ? '' : `<div class="dim" style="font-family:var(--mono);font-size:11px">no sleep logged yet</div>`;
  const _tierOld = !withDur.length
    ? ''
    : `<div class="dim" style="font-family:var(--mono);font-size:11px">${st.baseline_n >= 3 ? `usual: bed ${st.baseline_bed_clock} · up ${st.baseline_wake_clock} · ${fmtH(st.baseline_dur_min)}` : `${withDur.length} night${withDur.length > 1 ? 's' : ''} logged — baseline after 3`}${tier && tier !== 'none' ? ` · sleep bonus ${tier === 'full' ? '+6' : tier === 'partial' ? '+3' : '+0'}` : ''}${st.debt_min > 30 ? ` · <span style="color:var(--focus)">${st.debt_min}m short</span>` : ''}</div>`;
  const methodLabel = {up: 'up (steps)', app: 'app open', challenge: 'quiz', override: 'skipped quiz', alarm: 'alarm', shortcut: 'shortcut', fitbit: 'Fitbit'};
  const fb = last && last.source === 'fitbit';
  // Fitbit stages: one proportional bar (deep / REM / core / awake) under the stats
  const stagesBar = fb && last.deep != null ? (() => {
    const segs = [['deep', last.deep, '#6366F1'], ['REM', last.rem, '#A78BFA'], ['core', last.core, '#60A5FA'], ['awake', last.awake, '#FBBF24']].filter(s => s[1] > 0);
    const tot = segs.reduce((a, s) => a + s[1], 0) || 1;
    return `<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin:2px 0 4px">${segs.map(s => `<div title="${s[0]} ${s[1]}m" style="width:${(100 * s[1] / tot).toFixed(1)}%;background:${s[2]}"></div>`).join('')}</div>
      <div class="dim mono" style="font-size:10px;display:flex;gap:10px;flex-wrap:wrap">${segs.map(s => `<span><span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${s[2]};margin-right:3px"></span>${s[0]} ${fmtH(s[1])}</span>`).join('')}${last.efficiency ? `<span>· ${Math.round(last.efficiency)}% efficient</span>` : ''}</div>`;
  })() : '';
  // vitals: today's resting HR / HRV vs the 14-day median (server computes the baseline + flag)
  const v = st.vitals || {};
  const hv = (S.healthDays || []);
  const hToday = hv[hv.length - 1];
  const delta = (cur, base, unit, goodUp) => cur == null || base == null ? '' : (() => { const d = Math.round(cur - base); if (!d) return ''; const good = goodUp ? d > 0 : d < 0; return ` <span style="color:${good ? '#4ADE80' : '#FBBF24'};font-size:10px">${d > 0 ? '+' : ''}${d}${unit}</span>`; })();
  const vitalsLine = (v.rhr != null || v.hrv != null || hToday?.steps != null)
    ? `<div class="mono" style="font-size:11px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap">
        ${v.rhr != null ? `<span>❤️ ${Math.round(v.rhr)} bpm${delta(v.rhr, v.rhr_base, '', false)}</span>` : ''}
        ${v.hrv != null ? `<span>〰 HRV ${Math.round(v.hrv)} ms${delta(v.hrv, v.hrv_base, '', true)}</span>` : ''}
        ${hToday?.spo2 != null ? `<span>O₂ ${Math.round(hToday.spo2)}%</span>` : ''}
        ${hToday?.steps != null ? `<span>👟 ${hToday.steps.toLocaleString()}</span>` : ''}
        ${v.flag === 'strained' ? `<span style="color:#FBBF24">recover day · capacity ×${v.factor}</span>` : ''}
      </div>` : '';
  const srcLine = (fb || (S.healthDays || []).length || (S.settings || {}).health_last_ingest) ? ''
    : '';
  return `<div class="card"><h2>😴 Sleep${fb ? ' <span class="dim" style="font-size:10px;font-family:var(--mono);font-weight:400">· Fitbit</span>' : ''}</h2>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      ${stat(last?.bed || '—', fb ? 'ASLEEP AT' : 'BED')}
      ${stat(last?.wake || '—', (fb ? 'WOKE' : 'UP') + (last?.method && !fb ? ' · ' + (methodLabel[last.method] || last.method) : ''))}
      ${stat(fmtH(last?.dur_min), 'LAST NIGHT', last?.dur_min ? durColor(last.dur_min) : undefined)}
    </div>
    ${stagesBar}
    ${svg}
    ${tierLine}
    ${vitalsLine}
    ${srcLine}
  </div>`;
}


/* "not doing": delete an open task; if it came from email, log the dismissal so inbox-triage learns */
/* two-tap cancel: ✕ arms the row for 3 s (button turns red "sure?"); a second tap drops it.
   No confirm() dialog — it's blocked in the installed PWA and a dialog is what made the old ✕ feel dead. */
function armCancel(id){
  clearTimeout(S._cancelTimer);
  S._cancelArm = id; render();
  S._cancelTimer = setTimeout(() => { if (S._cancelArm === id) { S._cancelArm = null; render(); } }, 3000);
}
async function dismissTask(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  clearTimeout(S._cancelTimer); S._cancelArm = null;
  S.lastWrite = Date.now();
  const {data, error} = await db.rpc('lifeos_dismiss_task', {p_id: id});
  if (error || !data?.ok) { toast('❌ ' + (error?.message || data?.error || 'failed')); return; }
  S.tasks = S.tasks.filter(x => x.id !== id && x.parent_id !== id);
  toast(data.learned ? '✕ dropped — triage will learn from it' : '✕ dropped');
  render();
}

</script>
