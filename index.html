<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<link rel="manifest" href="manifest.webmanifest?v=2">
<title>LifeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#0B0C10; --card:#161923; --card2:#1E222E; --line:#272C39;
  --text:#EEF0F5; --dim:#8A90A0;
  --accent:#E1251B; --accent-hi:#FF4D42;
  --grad:linear-gradient(135deg,#FF4D42,#E1251B);
  --glow:0 4px 18px rgba(225,37,27,.35);
  --deep:#818CF8; --focus:#FBBF24; --light:#6EE7B7; --parallel:#C4B5FD;
  --done:#4ADE80;
  --mono:'Consolas','SF Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;touch-action:pan-y;overscroll-behavior-x:none;height:100%;overflow:hidden}
body{overflow:hidden;height:100%;overflow-x:clip}
/* content is its own scroller: rubber-band bounce stays INSIDE it, nav never moves */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;width:100%}
#app header{flex:0 0 auto;padding-left:14px;padding-right:14px}
main#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 12px calc(132px + env(safe-area-inset-bottom))}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5;touch-action:pan-y;overscroll-behavior-x:none;
  background-image:radial-gradient(1100px 480px at 50% -8%,rgba(225,37,27,.06),transparent 60%)}
nav{touch-action:pan-x}
.chips{touch-action:pan-x pan-y}   /* a scroll that starts on the filter chips must still scroll the page */
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
nav button,.schip,.btn,.tstart{transition:color .15s,border-color .15s,box-shadow .15s,transform .1s}
nav button:active,.schip:active,.btn:active,.tstart:active{transform:scale(.96)}
::selection{background:rgba(225,37,27,.4)}
/* 16px floor: anything smaller makes iOS Safari auto-zoom ~110% on focus — and it sticks */
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:#12141C;border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent-hi);box-shadow:0 0 0 3px rgba(225,37,27,.18)}
a{color:var(--light)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
main{touch-action:pan-y;display:block}

/* header */
header{display:flex;align-items:baseline;justify-content:space-between;padding:16px 2px 10px}
header h1{font-family:var(--mono);font-size:19px;font-weight:800;letter-spacing:1px}
header h1 .dot{color:var(--accent);text-shadow:0 0 14px rgba(225,37,27,.8)}
#streakChip{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.03)}
#streakChip b{color:var(--text)}
#pushBtn{background:none;border:none;font-size:14px;cursor:pointer;opacity:.35;padding:2px 4px}
#pushBtn.on{opacity:1}

/* nav — bottom tab bar, Instagram-style, scrolls sideways */
nav{position:fixed;bottom:0;left:0;right:0;z-index:45;display:flex;gap:4px;overflow-x:auto;
  background:rgba(11,12,16,.82);border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font-family:var(--mono);font-size:12px;letter-spacing:.5px;padding:10px 14px;border-radius:12px;
  color:var(--dim);border:1px solid transparent;white-space:nowrap;flex:0 0 auto}
nav button.on{color:#fff;background:var(--grad);box-shadow:var(--glow)}
nav button.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#fff;margin-right:6px;vertical-align:1px}

/* cards */
.card{background:linear-gradient(180deg,#191D28,#141721);border:1px solid rgba(255,255,255,.06);
  border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 26px rgba(0,0,0,.35)}
.card h2{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--dim);
  text-transform:uppercase;margin-bottom:9px}
.starthere{border-left:3px solid var(--accent);
  background:linear-gradient(90deg,rgba(225,37,27,.10),transparent 45%),linear-gradient(180deg,#191D28,#141721)}
.starthere .task-name{font-size:16px;font-weight:600}

/* energy bar */
.ebar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#12141C;margin:6px 0 4px;
  box-shadow:0 1px 3px rgba(0,0,0,.45) inset}
.ebar div{height:100%}
.elegend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--dim)}
.elegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}

/* filter chips */
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.chips button{font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;background:rgba(255,255,255,.02)}
.chips button.on{color:#0B0C10;font-weight:700}

/* task rows */
.trow{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(180deg,#181C26,#141720);
  border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:11px;margin-bottom:7px;position:relative;overflow:hidden}
.trow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rail,var(--line))}
.tcircle{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.tcircle.done{border-color:var(--done);color:var(--done);box-shadow:0 0 10px rgba(74,222,128,.25)}
.tcircle.partial{border-color:var(--focus);color:var(--focus)}
.tbody{flex:1;min-width:0}
.tname{word-wrap:break-word}
.trow.isdone .tname{color:var(--dim);text-decoration:line-through}
.tmeta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
/* per-task start button — right edge, far from the complete-circle on the left */
.tstart{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.02);color:var(--done);font-size:15px;margin-left:10px;cursor:pointer;align-self:center}
.tstart.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(225,37,27,.3)}
/* cancel button — same size as ▶, sits left of it; two taps: first arms (turns red, "sure?"), second drops the task */
.tcancel{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);
  color:var(--dim);font-size:14px;margin-left:10px;cursor:pointer;align-self:center;font-family:var(--mono)}
.tcancel.arm{border-color:var(--accent);color:#fff;background:var(--accent);font-size:10px;font-weight:700;width:auto;padding:0 9px}
/* 3-layer: goal rows + nested children */
details.goal{margin-bottom:6px}
details.goal>summary{list-style:none;cursor:pointer}
details.goal>summary::-webkit-details-marker{display:none}
.gprog{flex:0 0 auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line);
  border-radius:10px;padding:4px 7px;color:var(--dim);margin-top:1px}
.gprog.alldone{border-color:var(--done);color:var(--done)}
.gkids{margin:2px 0 4px 14px;border-left:2px solid var(--line);padding-left:8px}
/* plan editor rows */
.prow{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px}
.pdrag{touch-action:none;cursor:grab;color:var(--dim);padding:4px 10px;font-size:17px;flex:0 0 auto}
.prow .schip{flex:0 0 auto}
/* plan blocks on calendar grids (dashed = AI/suggestion, solid+📌 = locked) */
.pblk{position:absolute;left:52px;right:4px;border:1.5px dashed;border-radius:8px;font-size:10px;
  padding:2px 6px;overflow:hidden;background:rgba(11,12,16,.72);z-index:5;cursor:grab;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.pblk.locked{border-style:solid;background:rgba(255,255,255,.08);
  box-shadow:0 2px 10px -3px currentColor}
.wk-col .pblk{left:1px;right:1px;font-size:9px;padding:1px 3px}
/* scrollable 24h grid wrapper — opens at 6 AM, scroll up for 12 AM–6 AM */
.gridwrap{max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y;transform:translateZ(0);will-change:scroll-position;
  border:1px solid rgba(255,255,255,.07);border-radius:14px}
/* touches on the grid body commit to vertical scroll immediately; horizontal
   goes to JS (day paging) and blocks handle their own hold-drag */
.gridwrap .daygrid,.gridwrap .wk-grid,.gridwrap .wk-col{touch-action:pan-y}
/* scrollable tail INSIDE the grid scroller (2026-07-10): overscroll-behavior:
   contain means a maxed-out inner scroll never chains to the page, so any of
   the wrapper's bottom strip sitting under the fixed glass nav/addbar was
   unreachable — late evening (≈10:30 PM+) got cut off. 132px = main's own
   bottom-bar clearance. Taps on the tail are inert (outside .daygrid). */
.gridwrap::after{content:"";display:block;height:210px}  /* s36: cycle card above YC grid pushed it lower — bigger tail so midnight always clears the bars */
.tmeta .due-today{color:var(--focus)}
.tmeta .overdue{color:var(--accent)}
.tmeta .hard{color:var(--accent)}
.pname{font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--dim);margin:14px 2px 6px;text-transform:uppercase}

/* editor */
.editor{background:#12141C;border-top:1px solid var(--line);margin:10px -14px -14px;padding:12px 14px 14px;
  border-radius:0 0 15px 15px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.editor .full{grid-column:1/-1}
.editor label{font-family:var(--mono);font-size:10px;color:var(--dim);display:block;margin-bottom:2px;text-transform:uppercase}
.editor .btnrow{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.btn{padding:9px 16px;border-radius:11px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;
  background:rgba(255,255,255,.02)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;box-shadow:var(--glow)}
.btn.danger{color:var(--accent-hi)}

/* add bar — sits ABOVE the bottom nav */
#addbar{position:fixed;bottom:calc(57px + env(safe-area-inset-bottom));left:0;right:0;z-index:44;
  background:rgba(11,12,16,.82);border-top:1px solid rgba(255,255,255,.06);
  padding:8px 12px;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
#addbar .inner{max-width:576px;margin:0 auto}
#esel{display:flex;gap:6px;margin-bottom:6px}
#esel button{flex:1;font-family:var(--mono);font-size:11px;font-weight:700;padding:6px 0;border-radius:10px;
  border:1px solid var(--line);color:var(--dim)}
#esel button.on{color:#0B0C10}
#addrow{display:flex;gap:6px}
#addrow input{flex:1}
#addrow .btn{flex:0 0 auto;background:var(--grad);border-color:transparent;color:#fff;font-weight:700}
#addhint{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}

/* reflect */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric-grid label{font-family:var(--mono);font-size:10px;color:var(--dim);display:block;margin-bottom:2px;text-transform:uppercase}
.metric-grid .full{grid-column:1/-1}
.goalrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.goalrow:last-child{border-bottom:none}
.goalrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.goalrow .g-meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto}
#scorePreview{font-family:var(--mono);font-size:34px;font-weight:800;text-align:center;padding:8px;letter-spacing:-1px}
#scorePreview small{display:block;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:0}

/* brief markdown */
.md h1,.md h2,.md h3{font-family:var(--mono);margin:14px 0 6px;font-size:15px}
.md h1{font-size:17px}
.md h2{color:var(--accent-hi)}
.md p,.md ul,.md ol{margin-bottom:8px}
.md ul,.md ol{padding-left:20px}
.md code{font-family:var(--mono);background:var(--card2);padding:1px 4px;border-radius:4px;font-size:13px}
.md strong{color:#fff}

/* log */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400;text-transform:uppercase;font-size:10px}
.hit{color:var(--done)} .miss{color:var(--accent)} .rest{color:var(--dim)}

/* chat */
#chatlog{display:flex;flex-direction:column;gap:8px;min-height:40vh;max-height:60vh;overflow-y:auto;margin-bottom:10px;padding:2px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.45;overflow-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:5px;box-shadow:0 4px 14px rgba(225,37,27,.25)}
.msg.bot{align-self:flex-start;background:linear-gradient(180deg,#191D28,#141721);border:1px solid rgba(255,255,255,.06);border-bottom-left-radius:5px}
.msg.bot p{margin:0 0 6px}.msg.bot p:last-child{margin:0}
.msg.bot ul,.msg.bot ol{margin:0 0 6px;padding-left:18px}
.msg.bot code{font-family:var(--mono);background:var(--card2);padding:1px 4px;border-radius:4px;font-size:12px}
#chatrow{display:flex;gap:6px}
.typing{color:var(--dim);font-family:var(--mono);font-size:12px;align-self:flex-start;padding:6px 2px}

/* brief accordion */
details.bsec{background:linear-gradient(180deg,#191D28,#141721);border:1px solid rgba(255,255,255,.06);border-radius:14px;margin-bottom:8px;overflow:hidden}
details.bsec summary{cursor:pointer;padding:12px;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;color:var(--text);list-style:none;display:flex;
  justify-content:space-between;align-items:center;user-select:none}
details.bsec summary::-webkit-details-marker{display:none}
details.bsec summary::after{content:'+';color:var(--dim);font-size:15px}
details.bsec[open] summary::after{content:'\2212'}
details.bsec>.md{padding:0 12px 12px}
details.bsec.hot summary{border-left:3px solid var(--accent);padding-left:9px}
details.bsec>.ginner{padding:0 10px 10px}
.md li{margin:3px 0}
.md{line-height:1.55}
.bio b{font-weight:700;color:#fff}

/* add-task sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(180deg,#1A1E29,#12141C);border:1px solid rgba(255,255,255,.08);
  border-radius:22px 22px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:600px;max-height:88vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;transform:translateZ(0);will-change:scroll-position;
  box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.sheet::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--mono);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.sheet label{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;margin:12px 0 6px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x pan-y;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow.wrap{flex-wrap:wrap;overflow:visible}
.schip{font-family:var(--mono);font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;flex:0 0 auto;background:rgba(255,255,255,.02);cursor:pointer}
.schip.on{background:var(--text);border-color:var(--text);color:#0B0C10;font-weight:700}
.cal{margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.cal-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;margin-bottom:8px}
.cal-h button{padding:4px 14px;color:var(--dim);font-size:16px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.02)}
.cal-h button:active{color:var(--text);border-color:var(--dim)}
.cal-h button.ycnav{padding:7px 20px;font-size:22px;line-height:1}  /* bigger prev/next tap targets on the YC header */
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-g .dow{text-align:center;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px;padding:4px 0 6px}
.cal-d{position:relative;aspect-ratio:1;border-radius:10px;font-size:12px;color:var(--text);border:1px solid transparent;background:none}
.cal-d.today{border-color:var(--dim)}
.cal-d.sel{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(225,37,27,.35)}
.cal-d i{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-style:normal;font-size:8px;color:var(--focus)}
.cal-d.sel i{color:#fff}

/* full calendar tab */
.cal-d.big{aspect-ratio:auto;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;cursor:pointer}
.cal-d.big .marks{display:flex;gap:2px;margin-top:3px;align-items:center}
.cal-d.big .marks i{position:static;transform:none;width:5px;height:5px;border-radius:50%;display:block}
.cal-d.big .marks em{font-size:9px;color:var(--dim);font-style:normal;line-height:1}

/* month view — google-style titled chips */
.mo-cell{position:relative;min-height:68px;border:1px solid transparent;border-radius:10px;padding:2px 1px;
  display:flex;flex-direction:column;gap:1px;background:none;cursor:pointer;min-width:0;text-align:left}
.mo-cell.selq{border-color:rgba(255,255,255,.12);background:var(--card2);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.mo-d{font-size:11px;align-self:center;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;margin-bottom:1px;color:var(--text)}
.mo-cell.today{border-color:rgba(225,37,27,.3)}
.mo-cell.today .mo-d{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(225,37,27,.35)}
.mo-chip{font-size:8px;line-height:1.3;padding:1px 3px;border-left:2px solid;border-radius:3px;
  background:rgba(255,255,255,.05);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);max-width:100%}
.mo-more{font-size:8px;color:var(--dim);font-family:var(--mono);padding-left:2px}

/* flashcards */
.fc-front{font-size:17px;line-height:1.5;margin:10px 0}
.fc-back{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);line-height:1.5}

/* calendar events */
.evrow{display:flex;gap:10px;align-items:baseline;background:linear-gradient(180deg,#181C26,#141720);
  border:1px solid rgba(255,255,255,.05);border-left:3px solid var(--dim);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:13px}
.evrow .mono{color:var(--dim);font-size:11px;white-space:nowrap}
.evb{position:absolute;top:2px;right:4px;font-size:8px;color:var(--dim);font-weight:400;font-style:normal;font-family:var(--mono)}

/* day view timeline */
.daygrid{position:relative;background:#101219;border:1px solid rgba(255,255,255,.05);border-radius:14px;overflow:hidden;margin-top:8px}
.hrow{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.35}
.hrow span{position:absolute;top:1px;left:4px;font-family:var(--mono);font-size:9px;color:var(--dim);
  background:#101219;padding:0 3px;border-radius:4px;opacity:1}
.evblk{position:absolute;left:52px;right:8px;
  background:linear-gradient(180deg,rgba(225,37,27,.20),rgba(225,37,27,.10));

  padding:2px 8px;font-size:12px;overflow:hidden;z-index:1;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
.doneblk{position:absolute;right:2px;width:44%;background:rgba(74,222,128,.10);border-left:3px solid var(--done);border-radius:6px;padding:2px 6px;font-size:10px;line-height:1.3;color:var(--done);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none;z-index:3}
.doneblk b{font-family:var(--mono);font-size:9px;font-weight:600;margin-right:3px;opacity:.8}
.wk-done{position:absolute;right:1px;left:auto;max-width:94%;background:rgba(74,222,128,.14);border-left:2px solid var(--done);border-radius:4px;padding:1px 3px;font-size:8px;color:var(--done);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none;z-index:3}
.workblk{position:absolute;left:52px;width:38%;background:rgba(56,189,248,.13);border-left:3px solid #38BDF8;border-radius:6px;padding:2px 6px;font-size:10px;line-height:1.3;color:#7DD3FC;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none;z-index:1}
.workblk.live{border-left-style:dashed;background:rgba(56,189,248,.20)}
.wk-work{position:absolute;left:1px;width:26%;background:rgba(56,189,248,.22);border-left:2px solid #38BDF8;border-radius:3px;pointer-events:none;z-index:1}
.wk-work.live{border-left-style:dashed}
.evblk:active{filter:brightness(1.25)}
.evblk b{font-family:var(--mono);font-size:10px;font-weight:600;color:#FF9B94;display:block}
.nowline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent-hi),var(--accent) 60%,transparent);z-index:2}
.nowline::before{content:'';position:absolute;left:46px;top:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--accent-hi);box-shadow:0 0 8px rgba(255,77,66,.8)}

/* compact event/task lines (day-peek in add sheet) */
.wkline{font-size:12px;padding:2px 0;display:flex;gap:8px;align-items:center}
.wkline .mono{color:var(--dim);font-size:10px;min-width:42px}

/* week grid (google-style) */
.wk-head{display:flex;margin-bottom:2px}

.wk-banner{background:linear-gradient(180deg,rgba(129,140,248,.30),rgba(129,140,248,.16));

.wk-grid{position:relative;display:flex;background:#101219;border:1px solid rgba(255,255,255,.05);border-radius:14px;overflow:hidden;padding-left:30px}
.wk-rail{position:absolute;inset:0;pointer-events:none}

.wk-col.now{background:linear-gradient(180deg,rgba(225,37,27,.10),rgba(225,37,27,.02));

.wk-ev{position:absolute;left:1px;right:1px;
  background:linear-gradient(180deg,rgba(225,37,27,.24),rgba(225,37,27,.12));

  border-radius:4px;font-size:8px;line-height:1.15;padding:1px 2px;overflow:hidden;z-index:1}
/* work (Lenovo) commitments: slate-blue — structurally different from red personal events */
.evblk.work{background:linear-gradient(180deg,rgba(125,145,180,.22),rgba(125,145,180,.10));
  border-color:rgba(148,163,184,.45);border-left-color:#94A3B8}
.evblk.work b{color:#B9C5D6}
.wk-ev.work{background:linear-gradient(180deg,rgba(125,145,180,.26),rgba(125,145,180,.12));border-left-color:#94A3B8}
/* weekends breathe differently */
.wk-col.wknd:not(.now){background:rgba(255,255,255,.025)}
.wk-col-h.wknd .wd{color:var(--light)}

/* segmented view switcher */
.seg{display:flex;background:#12141C;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 0;
  border-radius:999px;color:var(--dim);touch-action:pan-y;transition:color .15s,box-shadow .15s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 2px 10px rgba(225,37,27,.35)}

/* ===== calendar v3 — the "badass" pass (2026-07-10 s30) =====
   Override layer only: colors, typography, shadows, backgrounds, one veil.
   ZERO geometry/touch/z-contract changes — inline JS styles untouched.
   If grid scrolling ever regresses, remove the .gridwrap mask-image FIRST. */

/* ambient time-of-day wash — the 24h column carries night→dawn→dusk→night */
.daygrid{
  background:
    linear-gradient(180deg,
      rgba(46,58,120,.16) 0%, rgba(46,58,120,.10) 20%,
      rgba(255,166,87,.055) 30%, rgba(150,178,255,.05) 50%,
      rgba(255,146,80,.06) 71%, rgba(235,84,104,.08) 85%,
      rgba(44,48,110,.12) 93%, rgba(28,34,84,.16) 100%),
    #0E1017;
  border-color:rgba(255,255,255,.08)}
.wk-grid{
  background:
    linear-gradient(180deg,
      rgba(46,58,120,.16) 0%, rgba(46,58,120,.10) 20%,
      rgba(255,166,87,.055) 30%, rgba(150,178,255,.05) 50%,
      rgba(255,146,80,.06) 71%, rgba(235,84,104,.08) 85%,
      rgba(44,48,110,.12) 93%, rgba(28,34,84,.16) 100%),
    #0E1017;
  border-color:rgba(255,255,255,.08)}
/* hairline between the time rail and the canvas */
.daygrid::before{content:'';position:absolute;top:0;bottom:0;left:48px;width:1px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.05) 8%,rgba(255,255,255,.05) 92%,transparent)}

/* the scroller: soft fade at both edges — time feels continuous, not boxed */
.gridwrap{border-color:rgba(255,255,255,.09);
  box-shadow:0 18px 40px -28px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 10px), transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 10px), transparent 100%)}

/* hour rail: floating labels, no chips, tabular rhythm */
.hrow{border-top:1px solid rgba(255,255,255,.05);opacity:1}
.hrow span{background:none;padding:0 4px;color:rgba(214,220,235,.42);
  letter-spacing:.6px;text-shadow:0 1px 4px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
.wk-rail .hrow span{color:rgba(214,220,235,.35)}

/* events: layered glass, lit from above */
.evblk{
  background:linear-gradient(165deg, rgba(232,58,48,.30), rgba(225,37,27,.12) 55%, rgba(148,22,16,.16));
  border:1px solid rgba(255,109,100,.35);border-left:3px solid var(--accent);border-radius:10px;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.09);
  backdrop-filter:blur(3px) saturate(1.35);-webkit-backdrop-filter:blur(3px) saturate(1.35);
  transition:transform .12s, filter .12s}
.evblk:active{filter:brightness(1.2);transform:scale(.985)}
.evblk b{color:#FFB1AA;letter-spacing:.4px}
.evblk.work{
  background:linear-gradient(165deg, rgba(148,163,184,.26), rgba(125,145,180,.10) 55%, rgba(84,99,130,.14));
  border-color:rgba(163,178,200,.32);border-left-color:#94A3B8;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07)}
.evblk.work b{color:#C3CEDE}
.wk-ev{border-radius:5px;box-shadow:0 2px 6px -2px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  background:linear-gradient(165deg,rgba(232,58,48,.30),rgba(225,37,27,.14))}
.wk-ev.work{background:linear-gradient(165deg,rgba(148,163,184,.28),rgba(125,145,180,.12))}

/* AI suggestions read as *tentative*: faint diagonal weave; locked = lit solid */
.pblk{
  background:
    repeating-linear-gradient(45deg, transparent 0 7px, rgba(255,255,255,.028) 7px 14px),
    rgba(10,11,16,.74);
  box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
.pblk.locked{
  background:rgba(255,255,255,.09);
  box-shadow:0 2px 14px -2px currentColor, inset 0 1px 0 rgba(255,255,255,.10)}

/* now-line: glowing pulse dot + the past literally fades behind you */
.nowline{height:2px;z-index:7;pointer-events:none;
  background:linear-gradient(90deg,var(--accent-hi),var(--accent) 55%,rgba(225,37,27,.25));
  box-shadow:0 0 10px rgba(255,77,66,.55)}
.nowline::before{left:44px;top:-4px;width:10px;height:10px;
  background:var(--accent-hi);
  box-shadow:0 0 10px rgba(255,77,66,.9), 0 0 22px rgba(255,77,66,.45);
  animation:nowpulse 2.6s ease-in-out infinite}
.nowline::after{content:'';position:absolute;left:0;right:0;bottom:1px;height:2600px;z-index:-1;pointer-events:none;
  background:linear-gradient(to top, rgba(7,8,12,.30), rgba(7,8,12,.44) 260px)}
@keyframes nowpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@media (prefers-reduced-motion: reduce){.nowline::before{animation:none}}

/* week: quieter column seams, hotter today, real header hierarchy */
.wk-col{border-left:1px solid rgba(255,255,255,.035)}
.wk-col.now{background:linear-gradient(180deg,rgba(225,37,27,.13),rgba(225,37,27,.03) 30%,rgba(225,37,27,.02));
  box-shadow:1px 0 0 rgba(225,37,27,.3) inset, -1px 0 0 rgba(225,37,27,.3) inset}
.wk-col-h .wd{font-size:8px;letter-spacing:1.4px;text-transform:uppercase}
.wk-col-h .dn{font-size:16px;font-weight:700}
.wk-col-h.now .dn{box-shadow:0 3px 12px rgba(225,37,27,.5), inset 0 1px 0 rgba(255,255,255,.25)}

/* month: elevated selection, glowing today, chip polish */
.mo-cell{border-radius:12px;transition:background .15s}
.mo-cell.selq{background:linear-gradient(180deg,#181B26,#12141D);
  box-shadow:0 8px 20px -8px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.10) inset}
.mo-cell.today{border-color:rgba(225,37,27,.35);box-shadow:0 0 18px -6px rgba(225,37,27,.35)}
.mo-chip{border-radius:4px;background:rgba(255,255,255,.065);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}

/* all-day rows + view switcher */
.evrow{background:linear-gradient(165deg,#1A1E2A,#131722);
  box-shadow:0 4px 12px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04)}
.seg{background:#0F1118;border-color:rgba(255,255,255,.07);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.seg button.on{box-shadow:0 2px 12px rgba(225,37,27,.45), inset 0 1px 0 rgba(255,255,255,.22)}

/* ===== calendar v4 — landmarks · energy spines · grain · her palette (s30b) =====
   Additive layer on v3. CSS + one data-view attribute in render(). Rail rows
   render before blocks, so :nth-child(1..24) inside the grid = the 24 hours. */

/* landmark hours — ☾ midnight, 6 AM, ☀ noon, 6 PM anchor the scroll */
.daygrid > .hrow:nth-child(1), .daygrid > .hrow:nth-child(7),
.daygrid > .hrow:nth-child(13), .daygrid > .hrow:nth-child(19),
.wk-rail .hrow:nth-child(1), .wk-rail .hrow:nth-child(7),
.wk-rail .hrow:nth-child(13), .wk-rail .hrow:nth-child(19){
  border-top-color:rgba(255,255,255,.10)}
.daygrid > .hrow:nth-child(1) span, .daygrid > .hrow:nth-child(7) span,
.daygrid > .hrow:nth-child(13) span, .daygrid > .hrow:nth-child(19) span,
.wk-rail .hrow:nth-child(1) span, .wk-rail .hrow:nth-child(7) span,
.wk-rail .hrow:nth-child(13) span, .wk-rail .hrow:nth-child(19) span{
  color:rgba(230,236,250,.72);font-weight:700}
.daygrid > .hrow:nth-child(13) span::after, .wk-rail .hrow:nth-child(13) span::after{content:' ☀';opacity:.55}
.daygrid > .hrow:nth-child(1) span::after,  .wk-rail .hrow:nth-child(1) span::after{content:' ☾';opacity:.5}

/* plan blocks: a solid energy-colored spine on an otherwise tentative body
   (border color rides the inline currentColor the JS already sets) */
.pblk{border-left-style:solid;border-left-width:3px}

/* film grain on the canvas — restates v3's stacks (background is one property) */
.daygrid{
  background:
    radial-gradient(rgba(255,255,255,.014) 1px, transparent 1.4px),
    linear-gradient(180deg,
      rgba(46,58,120,.16) 0%, rgba(46,58,120,.10) 20%,
      rgba(255,166,87,.055) 30%, rgba(150,178,255,.05) 50%,
      rgba(255,146,80,.06) 71%, rgba(235,84,104,.08) 85%,
      rgba(44,48,110,.12) 93%, rgba(28,34,84,.16) 100%),
    #0E1017;
  background-size:22px 22px, auto, auto}
.wk-grid{
  background:
    radial-gradient(rgba(255,255,255,.014) 1px, transparent 1.4px),
    linear-gradient(180deg,
      rgba(46,58,120,.16) 0%, rgba(46,58,120,.10) 20%,
      rgba(255,166,87,.055) 30%, rgba(150,178,255,.05) 50%,
      rgba(255,146,80,.06) 71%, rgba(235,84,104,.08) 85%,
      rgba(44,48,110,.12) 93%, rgba(28,34,84,.16) 100%),
    #0E1017;
  background-size:22px 22px, auto, auto}

/* her calendar — violet-rose, unmistakably not your red */
main[data-view="yc"] .evblk{
  background:linear-gradient(165deg, rgba(192,132,252,.28), rgba(168,85,247,.12) 55%, rgba(112,50,180,.16));
  border-color:rgba(216,180,254,.38);border-left-color:#C084FC;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.09)}
main[data-view="yc"] .evblk b{color:#E4C8FF}
main[data-view="yc"] .wk-col.now{
  background:linear-gradient(180deg,rgba(192,132,252,.14),rgba(192,132,252,.03) 30%,rgba(192,132,252,.02));
  box-shadow:1px 0 0 rgba(192,132,252,.35) inset, -1px 0 0 rgba(192,132,252,.35) inset}
main[data-view="yc"] .wk-col-h.now .dn{
  background:linear-gradient(135deg,#C084FC,#9333EA);box-shadow:0 3px 12px rgba(168,85,247,.5)}
main[data-view="yc"] .mo-cell.today{border-color:rgba(192,132,252,.4);box-shadow:0 0 18px -6px rgba(192,132,252,.4)}
main[data-view="yc"] .mo-cell.today .mo-d{background:linear-gradient(135deg,#C084FC,#9333EA);box-shadow:0 2px 8px rgba(168,85,247,.4)}
main[data-view="yc"] .seg button.on{background:linear-gradient(135deg,#A855F7,#7C3AED);box-shadow:0 2px 12px rgba(168,85,247,.45)}
main[data-view="yc"] .nowline{background:linear-gradient(90deg,#E9D5FF,#A855F7 55%,rgba(168,85,247,.25));box-shadow:0 0 10px rgba(192,132,252,.55)}
main[data-view="yc"] .nowline::before{background:#E9D5FF;box-shadow:0 0 10px rgba(192,132,252,.9), 0 0 22px rgba(192,132,252,.45)}

/* her cycle on the month grid: actual period days solid rose, estimates a soft ring */
.mo-cell.cyca{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.3)}
.mo-cell.cyca .mo-d{color:#FDA4AF}
.mo-cell.cycp{box-shadow:inset 0 0 0 1px rgba(251,113,133,.35);background:rgba(251,113,133,.05)}

/* the time cursor goes COOL BLUE everywhere (s31, Skyler's ask) — a red line
   on a red theme camouflaged; blue cuts through. YC's stays violet via the
   higher-specificity data-view override above. */
.nowline{background:linear-gradient(90deg,#BAE6FD,#38BDF8 55%,rgba(56,189,248,.25));
  box-shadow:0 0 10px rgba(56,189,248,.6)}
.nowline::before{background:#E0F2FE;
  box-shadow:0 0 10px rgba(125,211,252,.95), 0 0 22px rgba(56,189,248,.5)}

/* auth */
#auth{max-width:340px;margin:80px auto;display:none}
#auth .card{padding:20px}

/* ---- QUESTS: swipe deck ---- */
.qstack{position:relative;height:min(62vh,560px);margin:4px 0 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.qcard{position:absolute;inset:0;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1B2030,#12151E);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 18px 40px rgba(0,0,0,.5);transform-origin:50% 100%;will-change:transform;cursor:grab}
.qcard.n1{transform:translateY(10px) scale(.965)}
.qcard.n2{transform:translateY(20px) scale(.93)}
.qcard.n1 .qbody,.qcard.n2 .qbody{visibility:hidden}
.qcard.top{z-index:3}.qcard.n1{z-index:2}.qcard.n2{z-index:1}
.qcard.fly{transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .32s}
.qcard.snap{transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.qimg{flex:0 0 38%;background:#0E1118 center/cover no-repeat;border-bottom:1px solid rgba(255,255,255,.05)}
.qcard.noimg .qimg{flex:0 0 22%;background:
  radial-gradient(120% 90% at 20% 0%,rgba(225,37,27,.22),transparent 55%),
  radial-gradient(90% 80% at 100% 100%,rgba(129,140,248,.18),transparent 55%),#0E1118}
.qbody{flex:1;padding:14px 16px 12px;display:flex;flex-direction:column;gap:7px;min-height:0}
.qwhen{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--focus)}
.qtitle{font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.2px}
.qwhere{font-size:13px;color:var(--dim)}
.qdesc{font-size:13px;line-height:1.45;color:#C9CDD8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;margin-top:2px;white-space:pre-line}
.qdesc.open{display:block;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;max-height:42vh;-webkit-line-clamp:unset}
.qdesc.more::after{content:"… more";color:var(--focus);font-family:var(--mono);font-size:11px}
.qcard .qimg.hi{flex:0 0 46%}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.qchip{font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:4px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03)}
.qchip.free{color:var(--done);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.qchip.cost{color:var(--focus);border-color:rgba(251,191,36,.35)}
.qchip a{color:inherit;text-decoration:none}
.qtag{position:absolute;top:18px;padding:6px 12px;border-radius:8px;font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:2px;
  border:3px solid;opacity:0;pointer-events:none;z-index:4;transform:rotate(-12deg)}
.qtag.r{left:16px;color:var(--done);border-color:var(--done)}
.qtag.l{right:16px;color:var(--accent-hi);border-color:var(--accent-hi);transform:rotate(12deg)}
.qtag.u{left:50%;top:40%;transform:translate(-50%,-50%);color:var(--deep);border-color:var(--deep);font-size:18px}
.qsrc .qbody{justify-content:center;text-align:center;gap:10px}
.qsrc .qtitle{font-size:24px}
.qbtns{display:flex;justify-content:center;gap:18px;margin:2px 0 16px}
.qbtn{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:22px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}
.qbtn.l{color:var(--accent-hi)}.qbtn.r{color:var(--done)}.qbtn.u{color:var(--deep);width:48px;height:48px;font-size:18px;align-self:center}
.qbtn:active{transform:scale(.92)}
.qrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.qrow .qd{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 64px;line-height:1.3;white-space:nowrap}
.qrow .qt{flex:1;min-width:0;font-size:13px}
.qrow .qt small{display:block;color:var(--dim);font-size:11px}
.qrow .btn{padding:4px 9px;font-size:11px}
.qempty{height:min(62vh,560px);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:20px;margin-bottom:10px}
body.desk .qstack{max-width:440px;margin-left:auto;margin-right:auto}
body.desk .qbtns{max-width:440px;margin-left:auto;margin-right:auto}
/* ---- EXPLORE: idea feed on the same stack ---- */
.qcard.ex .qbody{gap:9px}
.exkind{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.exkind b{color:var(--focus);font-weight:600}
.exkind.back b{color:var(--deep)}
.exhook{font-size:19px;font-weight:650;line-height:1.28;letter-spacing:-.1px}
.qcard.ex.lesson .exhook{font-size:17px}
.exscroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;font-size:13.5px;line-height:1.5;color:#D3D7E2;padding-right:2px}
.exscroll p{margin:0 0 8px}.exscroll strong{color:var(--text)}
.exsrc{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:auto;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exsrc a{color:inherit;text-decoration:none}
.exrow{display:flex;gap:8px;align-items:center}
.exrow input[type=number]{flex:1;min-width:0;font-size:18px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#0E1118;color:var(--text);font-family:var(--mono)}
.exrow .unit{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 auto;max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exslide{width:100%;margin:2px 0 0;accent-color:var(--focus)}
.exgo{padding:10px 16px;border-radius:12px;border:0;background:var(--grad);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:1px;flex:0 0 auto}
.exgo[disabled]{opacity:.5}
.exres{border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.exres .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.exres .pts{font-family:var(--mono);font-size:12px;color:var(--dim)}
.exres.good .big{color:var(--done)}.exres.ok .big{color:var(--focus)}.exres.bad .big{color:var(--accent-hi)}
.exans{width:100%;min-height:72px;resize:vertical;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0E1118;color:var(--text);font-family:inherit;line-height:1.4}
.exverdict{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.exverdict.correct{color:var(--done)}.exverdict.partial{color:var(--focus)}.exverdict.wrong{color:var(--accent-hi)}
.exchoice{display:flex;gap:10px}
.exchoice button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:1px}
.exchoice button.yes{color:var(--done);border-color:rgba(74,222,128,.4)}.exchoice button.no{color:var(--accent-hi);border-color:rgba(255,77,66,.35)}
.exstats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.exstats .qchip b{color:var(--text);font-weight:700}
.qtag.d{left:50%;top:40%;transform:translate(-50%,-50%);color:var(--deep);border-color:var(--deep);font-size:18px}
#auth input{margin-bottom:10px}
#authmsg{font-family:var(--mono);font-size:12px;color:var(--focus);margin-top:8px;min-height:16px}
.hidden{display:none!important}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(30,34,46,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 18px;font-family:var(--mono);font-size:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
.empty{color:var(--dim);font-family:var(--mono);font-size:12px;text-align:center;padding:20px}

/* ===== v5 — the "bevel pass" (2026-10-15) =====
   Visual layer only: hero numerals, ring gauges, gradient area charts, stat
   tiles, segmented energy bar. Additive CSS + VIZ.* helpers in the JS. Same
   rule as v3: zero geometry/touch/z-index changes to grids, sheets, nav. */
:root{
  --card-a:#171B27; --card-b:#11141C;
  --ok:#4ADE80; --ok-hi:#86EFAC; --warn:#FBBF24; --cool:#38BDF8;
  --grad-ok:linear-gradient(135deg,#86EFAC,#34D399);
  --grad-cool:linear-gradient(135deg,#7DD3FC,#38BDF8);
}
body{background-image:
  radial-gradient(1100px 520px at 50% -10%,rgba(225,37,27,.075),transparent 60%),
  radial-gradient(800px 460px at 110% 105%,rgba(56,189,248,.045),transparent 60%)}
header{padding-top:18px}
header h1{font-size:20px;letter-spacing:1.2px}
#streakChip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border-color:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
#streakChip b{font-size:14px;font-weight:800;letter-spacing:-.02em;font-family:'Inter',sans-serif}
#streakChip .flame{font-size:13px;filter:drop-shadow(0 0 6px rgba(255,120,60,.6))}
#streakChip.hot{border-color:rgba(255,120,60,.35);background:linear-gradient(180deg,rgba(255,120,60,.14),rgba(225,37,27,.05))}

/* cards: a touch deeper, rounder, lit from the top edge */
.card{border-radius:18px;background:linear-gradient(180deg,var(--card-a),var(--card-b));
  border-color:rgba(255,255,255,.07);padding:15px 14px 14px;
  box-shadow:0 1px 0 rgba(255,255,255,.055) inset,0 16px 36px -14px rgba(0,0,0,.65)}
.card h2{font-size:10.5px;letter-spacing:1.8px;color:rgba(180,187,204,.72);margin-bottom:10px}
.starthere{background:linear-gradient(90deg,rgba(225,37,27,.12),transparent 50%),linear-gradient(180deg,var(--card-a),var(--card-b))}

/* hero numerals — big, tight, tabular */
.hero{font-family:'Inter',-apple-system,sans-serif;font-weight:800;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;font-size:38px;color:#fff}
.hero small{font-size:.42em;font-weight:600;letter-spacing:0;color:var(--dim);margin-left:2px}
.hero.sm{font-size:26px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{--tc:var(--dim);position:relative;overflow:hidden;min-width:0;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:11px 11px 9px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tile::before{content:'';position:absolute;left:-30%;top:-70%;width:120%;height:140%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--tc) 22%,transparent),transparent 72%);opacity:.9}
.tile .v{position:relative;font-family:'Inter',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.035em;line-height:1.05;
  font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:.5em;font-weight:600;color:var(--dim);letter-spacing:0;margin-left:1px}
.tile.c .v{color:var(--tc)}
.tile .l{position:relative;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{position:relative;font-family:var(--mono);font-size:10px;margin-top:3px;color:var(--tc)}
.tile svg.spk{position:absolute;right:0;bottom:0;width:62%;height:34px;opacity:.5;pointer-events:none}

/* ring gauge */
.ring{position:relative;flex:0 0 auto;display:inline-block}
.ring svg{display:block;overflow:visible}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring .rv{font-family:'Inter',sans-serif;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.ring .rl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:3px}

/* score meter layout */
.meterbody{display:flex;align-items:center;gap:14px}
.meterhint{flex:1;min-width:0;font-size:13px;line-height:1.45}
.meterhint b{color:#fff}
.meterhint .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px;letter-spacing:.04em}
.meterhint .pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid currentColor;margin-bottom:6px;opacity:.95}

/* segmented energy bar — thicker, gapped, lit */
.ebar{height:14px;gap:3px;background:none;border-radius:0;box-shadow:none;margin:8px 0 8px;overflow:visible}
.ebar div{position:relative;border-radius:7px;min-width:6px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
.ebar div::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%)}
.ebar:has(> div:only-child){background:rgba(255,255,255,.05);border-radius:7px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.ebar.thin{height:8px;gap:2px}
.ebar.thin div{border-radius:4px}
.ebar.track{background:rgba(255,255,255,.05);border-radius:7px;gap:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.ebar.track div{border-radius:7px}
.elegend{gap:6px}
.elegend span{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);font-size:10.5px;letter-spacing:.04em}
.elegend i{margin:0;width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor}
.erow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.erow .dim{font-family:var(--mono);font-size:11px;letter-spacing:.04em}

/* chart frames */
.chart{position:relative;margin:4px 0 2px}
.chart svg{display:block;width:100%;height:auto}
.chart .xl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.06em;margin-top:4px;padding:0 2px}
.chart-head{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.chart-head .dim{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
.chart-head .delta{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05)}
.chart-head .delta.up{color:var(--ok)} .chart-head .delta.dn{color:var(--accent-hi)}

/* stats table → compact dense rows when still used */
table td:last-child{font-weight:700;color:#fff;text-align:right;font-variant-numeric:tabular-nums}

/* nav: a hair more presence */
nav button{font-size:11.5px;letter-spacing:.9px;padding:10px 15px}
nav button.on{box-shadow:0 4px 18px rgba(225,37,27,.4),inset 0 1px 0 rgba(255,255,255,.22)}

.tile{flex:1 1 0}

/* ===== v6 — laptop layout (2026-10-16) =====
   Everything below is gated on ≥1024px. Phones never match, so the iPhone PWA is
   untouched. JS side: isDesk() → sidebar nav, TODAY dashboard (todayDeskHTML),
   per-view layout classes on <main> (deskLayout). */
:root{--sb:244px}
#ptitle{display:none}
.card h2[style*="display:flex"]{white-space:nowrap}
.card h2[style*="display:flex"] > span.dim{min-width:0;overflow:hidden;text-overflow:ellipsis}
.card h2 .btn{white-space:nowrap}
@media (min-width:1024px){
  body.desk{background-image:
    radial-gradient(1200px 620px at 72% -12%,rgba(225,37,27,.075),transparent 60%),
    radial-gradient(900px 520px at 105% 105%,rgba(56,189,248,.05),transparent 60%),
    radial-gradient(700px 500px at 0% 100%,rgba(129,140,248,.04),transparent 60%)}
  #app{left:var(--sb);right:0;max-width:none;margin:0;width:auto}
  #app header{padding:24px 34px 12px;align-items:center;gap:14px}
  header h1{display:none}
  #ptitle{display:block;flex:1;min-width:0}
  #ptitle .greet{font-family:'Inter',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:#fff}
  #ptitle .gdate{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:5px}
  #ptitle .gdate b{color:var(--text);font-weight:600}
  main#main{padding:6px 34px 128px}

  /* sidebar */
  nav{top:0;bottom:0;left:0;right:auto;width:var(--sb);flex-direction:column;gap:1px;overflow-y:auto;overflow-x:hidden;
    padding:22px 14px 18px;border-top:none;border-right:1px solid rgba(255,255,255,.06);
    background:linear-gradient(180deg,rgba(14,16,22,.92),rgba(9,10,14,.92))}
  nav .nbrand{font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:1.2px;padding:2px 12px 6px;color:#fff}
  nav .nbrand .dot{color:var(--accent);text-shadow:0 0 14px rgba(225,37,27,.8)}
  nav .ngrp{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);opacity:.65;padding:18px 12px 6px}
  nav button{display:flex;align-items:center;gap:11px;width:100%;flex:0 0 auto;padding:9px 12px;border-radius:10px;
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;letter-spacing:0;color:rgba(214,220,235,.66);text-align:left;position:relative;border:none}
  nav button svg{width:18px;height:18px;flex:0 0 auto;opacity:.8}
  nav button:hover{background:rgba(255,255,255,.045);color:#fff}
  nav button:active{transform:none}
  nav button.on{background:linear-gradient(90deg,rgba(225,37,27,.20),rgba(225,37,27,.03));color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,77,66,.16)}
  nav button.on::before{content:'';display:block;position:absolute;left:-14px;top:8px;bottom:8px;width:3px;height:auto;margin:0;
    border-radius:0 3px 3px 0;background:var(--accent-hi);box-shadow:0 0 12px rgba(255,77,66,.85)}
  nav button.on svg{color:var(--accent-hi);opacity:1}
  nav button .nb{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;
    background:rgba(255,255,255,.07);color:var(--dim)}
  nav button.on .nb{background:rgba(255,77,66,.22);color:#fff}
  nav .nfoot{margin-top:auto;padding:16px 12px 0;font-family:var(--mono);font-size:10px;color:var(--dim);opacity:.6;line-height:1.6}
  nav .nfoot kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.14);color:var(--text)}

  /* add bar → floating command bar */
  #addbar{left:var(--sb);right:0;bottom:22px;background:none;border:none;padding:0 34px;
    backdrop-filter:none;-webkit-backdrop-filter:none}
  #addbar .inner{max-width:720px;background:rgba(20,23,32,.86);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:7px;
    backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:0 22px 60px -14px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05)}
  #addrow input{border:none;background:transparent;box-shadow:none!important;font-size:15px}

  /* sheets become centered modals */
  .overlay{align-items:center}
  .sheet{border-radius:22px;max-height:84vh;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .sheet::before{display:none}

  /* mouse affordances */
  .trow{transition:border-color .15s,background .15s}
  .trow:hover{border-color:rgba(255,255,255,.12)}
  .btn:hover,.schip:hover,.chips button:hover{border-color:rgba(255,255,255,.22)}
  *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px;border:2px solid transparent;background-clip:padding-box}

  /* per-view layouts (classes set by deskLayout) */
  main.desk.narrow > *{max-width:880px;margin-left:auto;margin-right:auto}
  main.desk.widecal > *{max-width:1320px;margin-left:auto;margin-right:auto}
  main.desk.widecal .gridwrap{max-height:calc(100vh - 250px)}
  main.desk.masonry{columns:400px 3;column-gap:16px}
  main.desk.masonry > *{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}

  /* TODAY dashboard */
  .dash{max-width:1640px;margin:0 auto}
  .dash .card{margin-bottom:14px}
  .dash-kpis{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
  .dash-kpis > .card{margin:0}
  .dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .dash-r{display:contents}
  .dash-col{min-width:0}
  .kpi{position:relative;overflow:hidden;display:flex;flex-direction:column}
  .kpi::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;pointer-events:none;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--kc,#8A90A0) 22%,transparent),transparent 70%)}
  .kpi .kv{position:relative;font-family:'Inter',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.045em;line-height:1;
    color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpi .kv small{font-size:.42em;font-weight:600;letter-spacing:0;color:var(--dim);margin-left:3px}
  .kpi .ks{position:relative;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--dim);margin-top:auto;padding-top:9px}
  .kpi .ks b{color:var(--kc);font-weight:700}
  .ktrack{position:relative;display:flex;gap:2px;height:8px;margin-top:12px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.06)}
  .ktrack i{display:block;height:100%;border-radius:5px}
  .sec-h{display:flex;align-items:baseline;gap:9px;margin:2px 2px 10px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .sec-h b{font-family:'Inter',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.02em;color:#fff}
  .sec-h .dim{margin-left:auto;letter-spacing:.06em}

  /* day strip */
  .ds{position:relative;padding-left:48px;margin-top:2px}
  .ds-hours{position:relative;height:16px;margin-bottom:4px}
  .ds-hours span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:rgba(214,220,235,.45);white-space:nowrap}
  .ds-tick{position:absolute;top:20px;bottom:0;width:1px;background:rgba(255,255,255,.05);pointer-events:none}
  .ds-lane{position:relative;height:32px;margin-bottom:6px;border-radius:9px;background:rgba(255,255,255,.025)}
  .ds-lane:last-child{margin-bottom:0}
  .ds-lane::before{content:attr(data-l);position:absolute;left:-48px;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim)}
  .ds-b{position:absolute;top:3px;bottom:3px;min-width:4px;border-radius:7px;overflow:hidden;padding:0 7px;
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 34%,transparent),color-mix(in srgb,var(--c) 16%,transparent));
    border-left:3px solid var(--c);font-size:11px;line-height:26px;white-space:nowrap;text-overflow:ellipsis;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);z-index:1}
  .ds-b.tent{border-left-style:dashed;opacity:.85}
  .ds-b[onclick]{cursor:pointer}
  .ds-b:hover{filter:brightness(1.2);z-index:2}
  .ds-past{position:absolute;top:20px;bottom:0;left:48px;border-radius:9px 0 0 9px;pointer-events:none;z-index:2;
    background:linear-gradient(90deg,rgba(7,8,12,.42),rgba(7,8,12,.30))}
  .ds-now{position:absolute;top:17px;bottom:-3px;width:2px;margin-left:-1px;border-radius:2px;z-index:3;pointer-events:none;
    background:#38BDF8;box-shadow:0 0 10px rgba(56,189,248,.85)}
  .ds-now::before{content:'';position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;
    background:#E0F2FE;box-shadow:0 0 8px #38BDF8}
  .kmeter-alt{display:none}
  main.desk.widecal .mo-cell{min-height:104px}
  main.desk.widecal .mo-chip{font-size:10px;padding:2px 4px}
  .ds-empty{position:absolute;left:12px;top:0;line-height:32px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
}
