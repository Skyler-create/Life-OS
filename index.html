<script>
/* ================= CONFIG — the ONLY three lines a new user changes ==== */
/* (setting up your own LifeOS? See SETUP.md in this repo — Claude does it) */
const SB_URL = 'https://xebiaoycxwstrzgkjult.supabase.co';   // your Supabase project URL
const SB_KEY = 'sb_publishable_ecGABp0TAZcVX_TLIjBbOQ_rqUKNATw'; // your publishable key
const OWNER  = 'skyler.scooty@gmail.com';                    // your email, lowercase
const GCAL_CLIENT_ID = '118493693943-6l9gncbacaip7d4fct7cgdkr5l51nm1j.apps.googleusercontent.com'; // optional: live Google Calendar (blank = use routine sync only)
const VAPID_PUBLIC = 'BIV0Jfwa19Q54frhQNxbdR2a8dN6Bw9zCSd_SPIXEeD2YFZbtX6YU3gVcH6bnbD3JHcxmNkXt_nDH2lpO3LDEVk'; // push notifications (GET /functions/v1/notify shows yours)
const CLAUDE_URL = 'https://claude.ai/project/019f2ae4-de05-714c-8cf0-3bd5d2b1b335'; // lifeOS Project — deep-brainstorm escape hatch in CHAT
/* Write tracking at the network layer (2026-10-22). Timer-based guards were not enough: a reload that
   starts AFTER a tap but BEFORE the UPDATE commits (slow mobile link, token refresh on resume) read a
   stale row and flipped the task back. Now every non-GET REST/RPC call is counted while in flight, and
   loadAll (a) waits until nothing is in flight before fetching and (b) drops any snapshot that overlapped
   a write. Belt-and-braces: cycleTask records its patch and loadAll re-applies it over a contradicting
   snapshot until a snapshot taken strictly AFTER the write resolved confirms it. */
const WR = {inflight: 0, lastStart: 0, lastDone: 0};
/* 2026-10-23 hotfix: supabase-js sends EVERY rpc() as POST, and loadAll itself calls ~25 read-only RPCs
   (credits, score, quests_deck, explore_feed, ...). Counting those as writes made loadAll invalidate its
   own snapshot every time → endless 400 ms refetch loop, blank page, 30 requests in flight. Only RPCs
   that actually mutate count now (allowlist — an unlisted write just loses the overlap guard, which is
   harmless; an unlisted read would bring the loop back). Table PATCH/POST/DELETE still count. */
const WRITE_RPC = /\/rpc\/lifeos_(save_reflection|apply_decomposition|attend_class|task_clockout|task_autocomplete|plan_day|claim_card_bonus|card_review|card_decide|wake_quiz_done|quests_swipe|quests_source_swipe|explore_act|news_feedback|tag_toggle|experiment_stop|money_unlock|money_lock|money_set_pin|stocks_sync|set_vacation|log_caffeine|dismiss_task)\b/;
/* 2026-10-25 OUTAGE FIX: PostgREST reconnects / schema-cache reloads a few times a day; while it rebuilds
   the cache every request answers 503 PGRST002 ("Could not query the database for the schema cache").
   loadAll used to take those errors as empty data and blank the page. Reads now retry on 5xx / network
   failure (0.8 s, 2 s, 4.5 s) — idempotent, so safe. Writes are never retried here. */
const READ_RETRY_MS = [800, 2000, 4500];
async function fetchRead(input, init){
  let lastErr = null;
  for (let i = 0; i <= READ_RETRY_MS.length; i++) {
    try {
      const r = await fetch(input, init);
      if (r.status < 500 || i === READ_RETRY_MS.length) return r;
      lastErr = null;
    } catch (e) { lastErr = e; if (i === READ_RETRY_MS.length) throw e; }
    await new Promise(res => setTimeout(res, READ_RETRY_MS[i]));
  }
  if (lastErr) throw lastErr;
}
const trackedFetch = (input, init) => {
  const method = ((init && init.method) || (input && input.method) || 'GET').toUpperCase();
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  const isRpc = url.indexOf('/rest/v1/rpc/') !== -1;
  const isWrite = method !== 'GET' && method !== 'HEAD' && url.indexOf('/rest/v1/') !== -1 && (!isRpc || WRITE_RPC.test(url));
  if (!isWrite) return fetchRead(input, init);
  WR.inflight++; WR.lastStart = Date.now();
  const done = () => { WR.inflight = Math.max(0, WR.inflight - 1); WR.lastDone = Date.now(); };
  return fetch(input, init).then(r => { done(); return r; }, e => { done(); throw e; });
};
const db = window.supabase.createClient(SB_URL, SB_KEY, {global: {fetch: trackedFetch}});
/* optimistic task patches awaiting confirmation: id → {patch, at, doneAt} */
const PENDING_TASK = {};
async function waitForWrites(maxMs){
  const t0 = Date.now();
  while (WR.inflight > 0 && Date.now() - t0 < maxMs) await new Promise(r => setTimeout(r, 80));
}

const ENERGY = {
  DEEP:    {color:'var(--deep)',     hex:'#818CF8', score:3},
  FOCUS:   {color:'var(--focus)',    hex:'#FBBF24', score:2},
  LIGHT:   {color:'var(--light)',    hex:'#6EE7B7', score:1},
  PARALLEL:{color:'var(--parallel)', hex:'#C4B5FD', score:1},
};
const PRIO = {high:3, med:2, low:1};

/* ================= state ================= */
let S = {
  tasks: [], goals: [], goalLogsToday: [], brief: null, todayLog: null, prevLog: null,
  view: localStorage.getItem('view') || 'today',
  filt: localStorage.getItem('filt') || 'ALL',
  addEnergy: localStorage.getItem('addEnergy') || 'FOCUS',
  showBacklog: false, search: '', editing: null, editMode: false,
  chat: JSON.parse(localStorage.getItem('chatHistory') || '[]'), sending: false,
  sheet: null, expandAll: false, openGroups: new Set(),
  bionic: localStorage.getItem('bionic') === '1',
  cards: [], showBack: false, calY: null, calM: 0, calSel: null,
  calView: localStorage.getItem('calView') || 'month',
  gcalEvents: [], gcalRange: null, gcalLive: false, gcalLoading: false,
};

// "today" = the CREDIT DAY (resets 6 AM, not midnight) so score/streak/done don't roll over overnight
const todayISO = () => { const d = new Date(); d.setHours(d.getHours() - 6); return d.toLocaleDateString('sv-SE'); };
// civil calendar date — CAL grids only (today-highlight, now-line, event defaults).
// At 12:40 AM Sunday the calendar says Sunday, even though the credit day is still Saturday.
const calTodayISO = () => new Date().toLocaleDateString('sv-SE');
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };

/* ================= auth ================= */
async function signIn(){
  const email = document.getElementById('a-email').value.trim();
  const pass  = document.getElementById('a-pass').value;
  const {error} = await db.auth.signInWithPassword({email, password: pass});
  document.getElementById('authmsg').textContent = error ? error.message : '';
}
async function signUp(){
  const email = document.getElementById('a-email').value.trim();
  const pass  = document.getElementById('a-pass').value;
  if (email.toLowerCase() !== OWNER) { document.getElementById('authmsg').textContent = 'Single-user system.'; return; }
  if (pass.length < 8) { document.getElementById('authmsg').textContent = 'Password: 8+ chars.'; return; }
  const {error} = await db.auth.signUp({email, password: pass});
  document.getElementById('authmsg').textContent = error ? error.message : 'Check your email to confirm, then sign in.';
}
db.auth.onAuthStateChange((event, session) => {
  document.getElementById('auth').style.display = session ? 'none' : 'block';
  document.getElementById('app').classList.toggle('hidden', !session);
  if (!session) { S._loadedOnce = false; return; }
  if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return;   // hourly token churn is not a reason to rebuild the page
  if (S._loadedOnce) return;
  loadAll();
});
document.getElementById('a-email').value = OWNER;

/* ================= data ================= */
/* server-side failure classifier: PostgREST schema cache (PGRST002/003), statement timeout (57014),
   connection limits (53300), connection failures (08xxx), gateway/fetch errors. */
function isServerHiccup(err){
  if (!err) return false;
  const code = String(err.code || ''), msg = String(err.message || '');
  if (/^PGRST00[0-3]$/.test(code) || code === '57014' || code === '53300' || /^08/.test(code) || code === '57P01' || code === '57P03') return true;
  if (/schema cache|statement timeout|failed to fetch|load failed|network|ECONNRESET|socket|gateway|service unavailable|too many connections|terminating connection|recovery mode/i.test(msg)) return true;
  if (err.name === 'TypeError' || err.name === 'AbortError') return true;
  return false;
}
function staleBar(on, n){
  let el = document.getElementById('stalebar');
  if (!on) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div'); el.id = 'stalebar';
    el.style.cssText = 'position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;background:#2A1F0E;color:#FBBF24;border:1px solid rgba(251,191,36,.45);border-radius:999px;padding:5px 12px;font:600 11px/1.3 Consolas,monospace;letter-spacing:.3px;box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    document.body.appendChild(el);
  }
  el.textContent = (S._loadedOnce ? '⚠ server hiccup — showing last data' : '⚠ server hiccup — loading') + ' · retrying' + (n > 1 ? ' (' + n + ')' : '') + '…';
}
async function loadAll(){
  // Never read while a write is in flight: the snapshot would predate the commit. Also keep the old
  // small grace period for a write that is about to be sent (S.lastWrite stamped, request not yet out).
  const sinceStamp = Date.now() - (S.lastWrite || 0);
  if (sinceStamp < 300) { await new Promise(r => setTimeout(r, 300 - sinceStamp)); }
  await waitForWrites(8000);
  const seq = loadAll._seq = (loadAll._seq || 0) + 1;
  const startedAt = Date.now();   // snapshot is only valid for writes that began AND finished BEFORE this
  loadAll._lastStart = startedAt;
  const today = todayISO();
  const [t, g, gl, b, dl, cd, ev, fz, fs, cr, pb, st, tt, dload, scn, wh, ss, adh, ex, wo, nw, ci, rt, pn, pp, cy, cm, mw, fa, ft, fr, stx, mch, jp, flog, jpn, jm, caf, sn, hdays, bsc, dtg, tnl, tfx, qdk, qcd, qsv, exf, exs] = await Promise.all([
    // 2026-10-23: 1,245 rows > PostgREST's 1,000-row cap — with order-by-due the rows silently dropped were the
    // LATEST-due and no-due ones, i.e. live tasks. Open tasks always; done tasks only from the last 30 days.
    db.from('tasks').select('*').or('status.neq.done,completed_at.gte.' + new Date(Date.now() - 30*864e5).toISOString()).order('due', {ascending:true, nullsFirst:false}),
    db.from('weekly_goals').select('*').eq('active', true).order('sort'),
    db.from('goal_logs').select('*').eq('date', today),
    db.from('briefs').select('*').eq('date', today).maybeSingle(),
    db.from('daily_log').select('*').order('date', {ascending:false}).limit(90),
    db.from('cards').select('*').lte('due', today).eq('suspended', false).order('due').limit(50),
    db.from('events').select('*').order('date').limit(300),
    db.from('freezes').select('*').gte('end_date', today).order('start_date'),
    db.from('focus_sessions').select('*').is('ended_at', null).order('started_at', {ascending: false}).limit(1),
    db.rpc('lifeos_credits'),
    db.from('plan_blocks').select('*').gte('date', today).order('date').order('start_min'),
    db.from('lifeos_settings').select('key,value'),
    db.from('timetree_events').select('*')
      .or(`start_ts.gte.${new Date(Date.now() - 60 * 864e5).toISOString()},start_date.gte.${new Date(Date.now() - 60 * 864e5).toLocaleDateString('sv-SE')}`)
      .order('start_ts', {ascending: true, nullsFirst: true}).limit(1000),
    db.from('day_load').select('*').gte('date', today).order('date').limit(3),
    db.rpc('lifeos_score', {d: today}),
    db.rpc('lifeos_week_health'),
    db.rpc('lifeos_sleep_stats', {d: today}),
    db.rpc('lifeos_adherence', {p_days: 14}),
    db.from('experiments').select('*').order('created_at', {ascending: false}).limit(12),
    db.from('waiting_on').select('*').eq('status', 'open').order('sent_at'),
    db.from('news_items').select('*').gte('date', new Date(Date.now() - 2 * 864e5).toLocaleDateString('sv-SE'))
      .order('date', {ascending: false}).order('rank').limit(20),
    db.from('cards').select('*').not('proposed_at', 'is', null).order('proposed_at').limit(12),
    db.rpc('lifeos_retention'),
    db.from('person_notes').select('*').eq('done', false).order('created_at'),
    db.from('people').select('*').order('month').order('day'),
    db.rpc('lifeos_cycle'),
    db.from('cycle_marks').select('*').order('date'),
    db.rpc('lifeos_money_week'),
    db.from('fin_accounts').select('*').order('institution').order('name'),
    db.from('fin_transactions').select('*').gte('posted', new Date(Date.now() - 400 * 864e5).toLocaleDateString('sv-SE'))
      .order('posted', {ascending: false}).limit(1000),   // money v2: the spending explorer aggregates client-side over ~13 months (PostgREST caps a request at 1,000 rows)
    db.from('fin_recurring').select('*').eq('active', true).eq('ignored', false).order('avg_amount', {ascending: false}),
    db.rpc('lifeos_stocks_context'),
    db.rpc('lifeos_money_charts'),                                                                    // money v2: net-worth history, portfolio history, window returns, freshness, months
    db.from('job_postings').select('*').neq('status','archived').neq('status','new').order('status_changed_at', {ascending:false}).limit(200),
    db.from('focus_sessions').select('id,task_id,energy,started_at,ended_at').gte('started_at', new Date(Date.now() - 60 * 864e5).toISOString()).order('started_at').limit(2000),
    db.from('job_postings').select('*').eq('status','new').order('rank_score', {ascending:false}).limit(60),
    db.from('job_materials').select('posting_id,status,track,tailored,answers,cover_note,error,updated_at'),
    db.rpc('lifeos_caffeine_context'),
    db.rpc('lifeos_sleep_nights', {p_days: 14}),
    db.rpc('lifeos_health_days', {p_days: 14}),
    db.rpc('lifeos_body_scores', {p_days: 14}),
    db.rpc('lifeos_day_tags'),
    db.rpc('lifeos_tonight_line'),
    db.rpc('lifeos_tag_effects', {p_days: 30}),
    db.rpc('lifeos_quests_deck', {p_limit: 40}),                                                      // side quests: ranked open cards
    db.rpc('lifeos_quests_candidates', {p_limit: 5}),                                                 // side quests: "follow @x?" source cards
    db.rpc('lifeos_explore_feed', {p_limit: 20}),                                                     // explore: comebacks + today's lesson + curio/guess mix
    db.rpc('lifeos_explore_stats'),
    db.from('quests').select('*').in('status', ['saved', 'going']).gte('event_date', today).order('event_date').order('starts_at'),
  ]);
  // 2026-10-25 OUTAGE FIX: if the server itself is failing (5xx / timeout / schema-cache reload / network),
  // do NOT overwrite good state with empties. Keep what is on screen, show the stale bar, retry with backoff.
  // A permanent per-query error (RLS, missing RPC) is NOT in this class and still falls through as before.
  const results = [t, g, gl, b, dl, cd, ev, fz, fs, cr, pb, st, tt, dload, scn, wh, ss, adh, ex, wo, nw, ci, rt, pn, pp, cy, cm, mw, fa, ft, fr, stx, mch, jp, flog, jpn, jm, caf, sn, hdays, bsc, dtg, tnl, tfx, qdk, qcd, qsv, exf, exs];
  const outage = results.filter(r => r && r.error && isServerHiccup(r.error));
  if (outage.length) {
    if (seq !== loadAll._seq) return;
    loadAll._fail = (loadAll._fail || 0) + 1;
    const wait = Math.min(30000, 1500 * Math.pow(2, loadAll._fail - 1));
    console.warn('loadAll: ' + outage.length + ' server-side failures (' + (outage[0].error.code || outage[0].error.message) + ') — keeping last good data, retry in ' + wait + ' ms');
    staleBar(true, loadAll._fail);
    clearTimeout(loadAll._retryT); loadAll._retryT = setTimeout(loadAll, wait);
    if (S._loadedOnce || outage.length >= results.length / 2) return;   // first load with a partial outage: render what came back, retry fills the rest
  } else { loadAll._fail = 0; staleBar(false); }
  S.tasks = t.data || []; S.goals = g.data || []; S.goalLogsToday = gl.data || [];
  // Re-apply taps the server has not visibly confirmed yet. A patch is retired only once a snapshot
  // taken strictly after its write resolved agrees with it (or 60 s pass, in case the write failed silently).
  for (const id in PENDING_TASK) {
    const p = PENDING_TASK[id], row = S.tasks.find(x => x.id === id);
    const confirmed = row && p.doneAt && startedAt > p.doneAt && row.status === p.patch.status;
    if (confirmed || Date.now() - p.at > 60000 || !row) { delete PENDING_TASK[id]; continue; }
    if (row.status !== p.patch.status) Object.assign(row, p.patch);
  }
  S.cards = cd.data || []; S.events = ev.data || []; S.freezes = fz.data || [];
  S.brief = b.data || null;
  S.focusOpen = (fs.data || [])[0] || null;
  S.credits = cr.data || null;
  S.planBlocks = pb.data || [];
  S.ttEvents = tt.data || [];
  S.dayLoad = (dload.data || []).find(r => r.date === today) || (dload.data || [])[0] || null;
  S.scoreNow = scn.data || null;   // C7: server is the ONLY score implementation
  S.weekHealth = wh.data || null;  // C4: "am I okay this week" (server-computed)
  S.sleepStats = ss.data || null;  // 5.1: sleep-aware capacity (server-computed)
  S.adherence = adh.data || null;  // fidelity loop: plan vs reality (server-computed)
  S.experiments = ex.data || [];   // self-experiment engine
  S.waitingOn = wo.data || [];     // worker v2: sent-but-unanswered ledger
  S.news = nw.data || [];          // personal news feed (radio routine curates)
  S.cardInbox = ci.data || [];     // C3: proposed cards awaiting approve/reject
  S.retention = rt.data || null;   // C3: per-topic retention health
  S.personNotes = pn.data || [];   // relationship layer: tell-YC ledger
  S.people = pp.data || [];        // people & dates
  S.cycle = cy.data || null;       // her cycle: estimates, never scripts
  S.cycleMarks = cm.data || [];    // actual period start marks
  S.money = mw.data || null;       // finance engine: single-source weekly read
  S.finAccounts = fa.data || [];
  S.finTx = ft.data || [];
  S.finRecurring = fr.data || [];
  S.jobs = (jp.data || []).concat(jpn.data || []);   // Slipstream v2: tracked postings + top-60 new by rank
  S.kits = {}; (jm.data || []).forEach(m => S.kits[m.posting_id] = m);   // apply kits (slip-prep)
  S.focusLog = flog.data || [];    // clocked-in history → blue work spans on CAL
  S.stocks = stx.data || null;     // stocks agent: quotes + indicators + latest report
  S.moneyCharts = (mch.data && !mch.data.locked) ? mch.data : null;   // money v2 chart feed (lifeos_money_charts)
  if (seq !== loadAll._seq) return;   // a newer loadAll is in flight — this snapshot is stale, drop it
  // RACE FIX (2026-10-21): a tap during an in-flight reload used to get overwritten — the tasks
  // SELECT had been answered BEFORE the UPDATE committed but its response landed AFTER the
  // optimistic render, so the row flipped back to undone (credits stayed: the server row was
  // done). The old check only looked at "write within 1200 ms of completion"; a reload that
  // started before the tap and finished >1.2 s after it slipped through. Now: any write that
  // began after this fetch started invalidates the whole snapshot → drop it and refetch.
  if ((S.lastWrite || 0) >= startedAt || WR.lastStart >= startedAt || WR.lastDone >= startedAt) {   // a write overlapped this fetch → snapshot may be stale
    loadAll._retries = (loadAll._retries || 0) + 1;
    if (loadAll._retries <= 4) { setTimeout(loadAll, 400); return; }   // 2026-10-23: never loop forever — after 4 overlaps render what we have (PENDING_TASK still protects taps)
    console.warn('loadAll: writes kept overlapping, rendering the snapshot anyway');
  }
  loadAll._retries = 0;
  if (caf.data) S.caff = caf.data;    // caffeine module: level/curve/bags/last-safe (server-computed); keep old on a failed RPC
  if (!S.qDrag) { S.questDeck = qdk.data || []; S.questCands = qcd.data || []; S.questSaved = qsv.data || []; }   // side quests (don't yank a card mid-drag)
  if (!S.qDrag && !S.exBusy) { S.exFeed = Array.isArray(exf.data) ? exf.data : []; }                   // explore feed (not while a card is mid-interaction)
  S.exStats = exs.data || S.exStats || null;
  S.sleepNights = sn.data || [];   // sleep card: 14 nights — Fitbit session when one exists, else bed = last app close, wake = ranked confirmation
  S.body = bsc.data || [];        // v7: sleep score + readiness (lifeos_body_scores)
  S.dayTags = dtg.data || [];     // day tags (manual + auto caffeine-late) for the credit day
  S.tonight = tnl.data || null;   // one-sentence tonight line (server)
  S.tagEffects = tfx.data || [];  // per-tag sleep effect sizes, 30 d
  S.healthDays = hdays.data || []; // Fitbit vitals (resting HR, HRV, steps, SpO2, resp) via Apple Health → LifeOS Health shortcut
  S.expStats = {}; S.expArms = {};
  try {
    const actives = S.experiments.filter(e => e.status === 'active').slice(0, 4);
    if (actives.length) {
      const [ed, ...sts] = await Promise.all([
        db.from('experiment_days').select('exp_id,arm').eq('date', today),
        ...actives.map(e => db.rpc('lifeos_experiment_stats', {p_exp: e.id})),
      ]);
      S.expArms = Object.fromEntries((ed.data || []).map(r => [r.exp_id, r.arm]));
      actives.forEach((e, i) => { S.expStats[e.id] = sts[i].data || null; });
    }
  } catch (e) { /* experiments card degrades gracefully */ }
  S.settings = Object.fromEntries((st.data || []).map(r => [r.key, r.value]));
  try { S.wakeTargets = JSON.parse(S.settings.wake_targets || '{}'); } catch(e){ S.wakeTargets = {}; }
  const logs = dl.data || [];
  S.todayLog = logs.find(l => l.date === today) || null;
  S.prevLog  = logs.find(l => l.date < today) || null;
  S.logs = logs;
  if (!S._loadedOnce) { S._loadedOnce = true; render(); } else renderSoft();
  subscribeRealtime();
  captureWake();
  updatePushBtn();
  refreshPushSub();
  // Google Calendar: NO automatic re-auth on load. The GIS token client always
  // opens a popup (there is no truly silent refresh in the implicit flow), and on
  // iOS it shows the account chooser every time. Live mode lasts one token (~1h);
  // after that the CAL tab quietly falls back to the mirrored `events` table and
  // shows a "reconnect Google" chip. Tap it only when you want live editing.
}

/* auto-capture wake time: first app open of the day, morning window only */
async function captureWake(){
  const today = todayISO();
  if (localStorage.getItem('wakeStamped') === today) return;
  if (S.todayLog?.wake_time) { localStorage.setItem('wakeStamped', today); return; }
  const now = new Date(), h = now.getHours();
  if (h < 4 || h >= 13) return; // opening the app at 3 AM or 8 PM is not "waking up"
  const hhmm = String(h).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  S.lastWrite = Date.now();
  const {error} = await db.from('daily_log').upsert({date: today, wake_time: hhmm}, {onConflict: 'date'});
  if (!error) {
    localStorage.setItem('wakeStamped', today);
    if (S.todayLog) S.todayLog.wake_time = hhmm; else S.todayLog = {date: today, wake_time: hhmm};
    toast('Wake captured: ' + hhmm);
  }
}

const frozenToday = () => (S.freezes || []).some(f => f.start_date <= todayISO() && todayISO() <= f.end_date);
function urlB64ToU8(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function updatePushBtn(){
  const b = document.getElementById('pushBtn'); if (!b) return;
  b.classList.toggle('on', pushSupported() && Notification.permission === 'granted');
}
async function savePushSub(sub){
  S.lastWrite = Date.now();
  const row = { endpoint: sub.endpoint, subscription: sub.toJSON(), ua: navigator.userAgent.slice(0, 120) };
  const {error} = await db.from('push_subs').upsert(row, {onConflict: 'endpoint'});
  if (error) toast('Push save failed: ' + error.message);
  return !error;
}
async function enablePush(){
  if (!pushSupported()) {
    const ios = /iPhone|iPad/.test(navigator.userAgent);
    toast(ios ? 'iOS: install first — Share → Add to Home Screen, then open from the icon' : 'Push not supported in this browser');
    return;
  }
  const perm = await Notification.requestPermission();   // must be inside a user gesture (this click)
  if (perm !== 'granted') { toast('Notifications blocked — enable in Settings if you change your mind'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(VAPID_PUBLIC) });
    if (await savePushSub(sub)) toast('Push enabled — brief, streak-risk + reflection nudges are live');
  } catch (e) { toast('Subscribe failed: ' + (e.message || e)); }
  updatePushBtn();
}
/* keep the stored subscription fresh (endpoints rotate) — silent, only if already granted */
async function refreshPushSub(){
  if (!pushSupported() || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await savePushSub(sub);
  } catch { /* offline etc — next open */ }
}

/* ================= live sync ================= */
let rtChannel = null, rtTimer = null;
/* any open editor/sheet: background re-renders must not rebuild the DOM under the
   user's thumb (kills iOS momentum scroll, wipes half-typed inputs) */
function uiBusy(){
  const a = document.activeElement;   // typing anywhere in the app counts as busy — a rebuild would eat the keyboard
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest && a.closest('#main,#sheetroot,#addbar');
  return !!(typing || S.editing || S.sending || S.sheet || S.planEditMode || S.brewEdit || S.caffPick || S.bagEdit || S.pbSheet || S.evSheet || S.dropAsk || S.clockAsk || PDrag || S.qDrag);
}
function uiScrolling(){ return Date.now() - Math.max(S._gsAt || 0, S._msAt || 0) < 1200; }
/* background refresh that arrives while the user is busy: remember it, replay when free */
function renderSoft(){ if (uiBusy() || uiScrolling()) { S._dirty = true; return; } S._dirty = false; render(); }
// any scroller in the app (main, grid, sheet, chat log, prep panel): scroll doesn't bubble, so capture it
document.addEventListener('scroll', () => { S._msAt = Date.now(); }, {capture: true, passive: true});
function subscribeRealtime(){
  if (rtChannel) return;
  rtChannel = db.channel('lifeos-sync')
    .on('postgres_changes', {event: '*', schema: 'public'}, () => {
      // ignore the echo of our own writes — they're already on screen
      if (Date.now() - (S.lastWrite || 0) < 2500) { clearTimeout(rtTimer); rtTimer = setTimeout(() => { if (!uiBusy() && !uiScrolling()) loadAll(); else S._dirty = true; }, 2600); return; }
      clearTimeout(rtTimer);
      // 2026-10-25: dns_sync and friends write every minute; one realtime-triggered reload per 15 s is plenty
      const sinceLoad = Date.now() - (loadAll._lastStart || 0);
      rtTimer = setTimeout(() => {
        if (uiBusy()) { S._dirty = true; return; }
        if (uiScrolling()) { clearTimeout(rtTimer); rtTimer = setTimeout(() => { if (!uiBusy() && !uiScrolling()) loadAll(); else S._dirty = true; }, 1200); return; } // don't rebuild mid-scroll
        loadAll();
      }, Math.max(600, 15000 - sinceLoad));
    })
    .subscribe();
}
/* coming back to the app after it sat in the background: refresh once if the last load is >45 s old */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S._loadedOnce) return;
  if (Date.now() - (loadAll._lastStart || 0) > 45000 && !uiBusy()) loadAll();
});

/* ================= task helpers ================= */
/* local calendar day of a timestamptz — NOT the UTC slice. Tasks finished after
   7 PM CT used to land on "tomorrow" because toISOString() is UTC. */
const localDay = ts => { if (!ts) return ''; const d = new Date(ts); d.setHours(d.getHours() - 6); return d.toLocaleDateString('sv-SE'); };  // credit-day (6 AM) bucket
const isDoneToday = t => t.status === 'done' && localDay(t.completed_at) === todayISO();
const isPartialToday = t => t.partial_date === todayISO();
const dueTag = t => {
  if (!t.due) return '';
  const today = todayISO();
  if (t.due < today && t.status !== 'done') return `<span class="overdue">overdue ${esc(t.due.slice(5))}</span>`;
  if (t.due === today) return `<span class="due-today">due today</span>`;
  return `<span>due ${esc(t.due.slice(5))}</span>`;
};
const chunkTag = t => t.chunk_total ? ` (${t.chunk_index}/${t.chunk_total})` : '';

async function cycleTask(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  let patch;
  if (t.status === 'done')            patch = {status:'in_progress', completed_at:null, partial_date:todayISO()};
  else if (isPartialToday(t))         patch = {status:'not_started', completed_at:null, partial_date:null};
  else                                patch = {status:'done', completed_at:new Date().toISOString(), partial_date:null};
  Object.assign(t, patch);
  PENDING_TASK[id] = {patch, at: Date.now(), doneAt: null};
  // Full optimistic re-render (scroll is preserved): the START HERE card
  // advances to the next task IMMEDIATELY, the list row checks off, the
  // energy bar / goal cards / chips all update in the same frame. (The old
  // patch-one-node shortcut hit the WRONG node when the task appeared in
  // both the START HERE card and the list — the card never advanced.)
  render();
  S.lastWrite = Date.now();
  const {error} = await db.from('tasks').update(patch).eq('id', id);
  if (error) { delete PENDING_TASK[id]; toast('Save failed: ' + error.message); loadAll(); return; }
  if (PENDING_TASK[id]) PENDING_TASK[id].doneAt = Date.now();
  // reconcile the cheap server-derived bits (credits +5, weekly-goal chip
  // from the goal_logs trigger) without the heavy full loadAll
  refreshLight();
}

/* quick-add parsing: #project !prio 90m/1.5h due:tom hard */
function parseQuickAdd(raw){
  let title = raw, out = {energy: S.addEnergy, bucket: (S.view === 'tasks' && S.showBacklog) ? 'backlog' : 'active'};
  const grab = (re, fn) => { const m = title.match(re); if (m) { fn(m); title = title.replace(re, ''); } };
  grab(/#(\S+)/,        m => out.project = m[1].replace(/-/g,' '));
  grab(/!(high|med|low)\b/i, m => out.priority = m[1].toLowerCase());
  grab(/\b(\d+(?:\.\d+)?)h\b/i, m => out.est_minutes = Math.round(parseFloat(m[1]) * 60));
  grab(/\b(\d+)m\b/i,   m => out.est_minutes = parseInt(m[1]));
  grab(/\bdue:(\S+)/i,  m => {
    const v = m[1].toLowerCase(); const d = new Date();
    if (v === 'today') out.due = todayISO();
    else if (v === 'tom' || v === 'tomorrow') { d.setDate(d.getDate()+1); out.due = d.toLocaleDateString('sv-SE'); }
    else if (/^\d{4}-\d{2}-\d{2}$/.test(v)) out.due = v;
  });
  grab(/\bhard\b/i, () => out.deadline_type = 'hard');
  if (out.due && !out.deadline_type) out.deadline_type = 'self_imposed';
  out.title = title.replace(/\s+/g,' ').trim();
  return out;
}
function addTask(){

}
async function saveSheet(){

  const row = {

  const {data, error} = await db.from('tasks').insert(row).select().single();
  if (error) { toast('Add failed: ' + error.message); return; }
  S.sheet = null; if (data) S.tasks.push(data);

  loadAll();  // background refetch so any auto-chunk split shows

/* swipe left/right (touch OR mouse drag) to switch tabs — page follows the finger */
(() => {
  const mainEl = document.getElementById('main');
  mainEl.addEventListener('scroll', () => { S._msAt = Date.now(); }, {passive: true});
  let sw = null;
  const excluded = t => t && t.closest && t.closest('nav,#addbar,#sheetroot,#auth,input,textarea,select,.chips,.chiprow,.prow,.pdrag,.noswipe,.metric-grid');
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (excluded(e.target)) return;
    if (uiBusy()) return;
    sw = {x: e.clientX, y: e.clientY, t: Date.now(), active: false, tgt: e.target};
  }, {passive: true});
  document.addEventListener('pointermove', e => {
    if (!sw) return;
    if (!sw.active) {
      // instantaneous move since last event
      const ix = e.clientX - (sw.lx != null ? sw.lx : sw.x);
      const iy = e.clientY - (sw.ly != null ? sw.ly : sw.y);
      sw.lx = e.clientX; sw.ly = e.clientY;
      if (sw.hx == null) sw.hx = sw.x;
      // While the finger moves mostly vertically (scrolling), glue the horizontal
      // reference to the finger — so a later sideways move is measured fresh and a
      // tab-swipe can start EVEN mid vertical-scroll (no longer cancels on scroll).
      if (Math.abs(iy) > Math.abs(ix)) sw.hx = e.clientX;
      const hdx = e.clientX - sw.hx;
      // Activate on a dominant sideways move; tolerant of angled swipes (per-move
      // horizontal only has to beat per-move vertical, so ~15° off-axis is fine).
      if (Math.abs(hdx) > 22 && Math.abs(hdx) >= Math.abs(iy) && Date.now() - (S._msAt || 0) > 150) {
        sw.active = true;
        sw.x = e.clientX - hdx;   // anchor animation + distance origin at swipe start
        sw.y = e.clientY;         // reset vertical origin so angled swipes still pass
        sw.t = Date.now();        // reset timer so a flick after scrolling still counts
        document.body.style.userSelect = 'none';
      }
    }
    if (sw && sw.active) {
      const dx = e.clientX - sw.x;
      mainEl.style.transition = 'none';
      mainEl.style.transform = `translateX(${dx}px)`;
      mainEl.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx) / 600));
    }
  }, {passive: true});
  function slideTo(ni, dir, fromX){
    const w = Math.min(window.innerWidth, 640);
    // finish sliding the current page out in the direction of travel
    mainEl.style.transition = 'transform .13s ease-in, opacity .13s ease-in';
    mainEl.style.transform = `translateX(${-dir * w}px)`;
    mainEl.style.opacity = '0';
    setTimeout(() => {
      setView(VIEWS[ni][0]);
      // place the new page just off-screen on the other side, then slide it in
      mainEl.style.transition = 'none';
      mainEl.style.transform = `translateX(${dir * w * 0.55}px)`;
      mainEl.style.opacity = '0.3';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        mainEl.style.transition = 'transform .2s cubic-bezier(.2,.8,.3,1), opacity .2s';
        mainEl.style.transform = ''; mainEl.style.opacity = '';
      }));
    }, 130);
  }
  const endSwipe = e => {
    if (!sw) return;
    if (e.type === 'pointercancel' && !e.clientX && !e.clientY) { // browser stole it and gave us nothing
      sw = null; document.body.style.userSelect = '';
      mainEl.style.transition = 'transform .18s ease, opacity .18s';
      mainEl.style.transform = ''; mainEl.style.opacity = '';
      return;
    }
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y, dt = Date.now() - sw.t;
    const wasActive = sw.active, swX = sw.x; sw = null;
    document.body.style.userSelect = '';
    const snapBack = () => {
      mainEl.style.transition = 'transform .18s cubic-bezier(.2,.8,.3,1), opacity .18s';
      mainEl.style.transform = ''; mainEl.style.opacity = '';
    };
    if (!wasActive || uiBusy()) { snapBack(); return; }
    // a real drag shouldn't also count as a click on whatever's under the finger
    const kill = ev => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener('click', kill, {capture: true, once: true});
    setTimeout(() => document.removeEventListener('click', kill, {capture: true}), 120);
    const flick = dt < 300 && Math.abs(dx) > 35;             // quick flick
    const drag  = Math.abs(dx) > 55;                          // deliberate drag
    if ((!flick && !drag) || Math.abs(dx) < Math.abs(dy)) { snapBack(); return; }  // within ~45° counts
    // inside the calendar: swipes starting near the screen edges switch tabs
    // (BRIEF ⟷ CAL ⟷ CHAT); swipes starting in the middle page through time.
    // Note: the outermost ~20px belong to iOS (browser back/forward) — the usable
    // tab-switch band is roughly 20-70px from either edge.
    const EDGE = 70;
    const fromEdge = swX < EDGE || swX > window.innerWidth - EDGE;
    if ((S.view === 'cal' || S.view === 'yc') && !fromEdge) {
      const dir = dx < 0 ? 1 : -1;
      const pageFn = S.view === 'yc' ? navYC : navCal;   // YC tab pages her calendar, same feel as CAL
      const w = Math.min(window.innerWidth, 640);
      mainEl.style.transition = 'transform .13s ease-in, opacity .13s ease-in';
      mainEl.style.transform = `translateX(${-dir * w}px)`; mainEl.style.opacity = '0';
      setTimeout(() => {
        pageFn(dir);
        mainEl.style.transition = 'none';
        mainEl.style.transform = `translateX(${dir * w * 0.55}px)`; mainEl.style.opacity = '0.3';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          mainEl.style.transition = 'transform .2s cubic-bezier(.2,.8,.3,1), opacity .2s';
          mainEl.style.transform = ''; mainEl.style.opacity = '';
        }));
      }, 130);
      return;
    }
    const i = VIEWS.findIndex(v => v[0] === S.view);
    const ni = i + (dx < 0 ? 1 : -1);
    if (ni < 0 || ni >= VIEWS.length) { snapBack(); return; }
    slideTo(ni, dx < 0 ? 1 : -1);
  };
  document.addEventListener('pointerup', endSwipe);
  document.addEventListener('pointercancel', endSwipe); // gesture stolen mid-drag still commits if it traveled far enough
})();
function bionicify(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node => {
    const txt = node.nodeValue;
    if (!txt.trim()) return;
    if (node.parentElement.closest('code,pre')) return;
    const span = document.createElement('span'); span.className = 'bio';
    span.innerHTML = esc(txt).replace(/[A-Za-zÀ-ɏ]{2,}/g, w => {
      const k = Math.ceil(w.length * 0.45);
      return '<b>' + w.slice(0, k) + '</b>' + w.slice(k);
    });
    node.parentNode.replaceChild(span, node);
  });
}

/* --- TODAY --- */
/* place_context gate: at_work tasks only on days with a work block, weekday
   tasks Mon–Fri, weekend tasks Sat/Sun. The planner already respects this —
   the TODAY deck + START HERE now do too ("Lydia on a Sunday" bug, s36). */
function placeOk(t){
  const pc = t && t.place_context;
  if (!pc || pc === 'any') return true;
  const dow = new Date().getDay();
  if (pc === 'weekend') return dow === 0 || dow === 6;
  if (pc === 'weekday') return dow >= 1 && dow <= 5;
  if (pc === 'at_work') return (S.events || []).some(e => e.date === todayISO() && e.source === 'work');
  return true;
}
/* live START HERE — always points at the best thing to do RIGHT NOW.
   1) the brief's marked task while it's open → 2) current/next plan block whose
   task is open → 3) highest-priority open task due today. Recomputes on every
   render, so completing the task advances the card. */
function startHereNow(todays){
  const kids = S._kids || {};
  const byTitle = title => S.tasks.find(x => (x.title || '').toLowerCase() === (title || '').toLowerCase()
    && x.status !== 'done' && !(kids[x.id] || []).length);
  const sh = S.brief?.start_here_task ? byTitle(S.brief.start_here_task) : null;
  if (sh && placeOk(sh)) return {t: sh, why: 'morning pick'};
  const n = new Date(); const nowM = n.getHours() * 60 + n.getMinutes();
  const fmt = m => { const h = Math.floor(m / 60) % 24, mm = String(m % 60).padStart(2, '0'),
    h12 = h % 12 || 12; return `${h12}:${mm} ${h < 12 ? 'AM' : 'PM'}`; };
  const blocks = (S.planBlocks || []).filter(b => b.date === todayISO() && b.kind === 'task')
    .sort((a, b) => a.start_min - b.start_min);
  for (const b of blocks){
    if (b.end_min <= nowM) continue;
    const t = (b.task_id && S.tasks.find(x => x.id === b.task_id && x.status !== 'done')) || byTitle(b.title);
    if (t) return {t, why: b.start_min <= nowM ? 'on the plan now' : 'next on the plan · ' + fmt(b.start_min)};
  }
  const open = (todays || []).filter(t => t.status !== 'done' && placeOk(t));
  if (open.length){
    const t = [...open].sort((a, b) => (PRIO[b.priority] || 2) - (PRIO[a.priority] || 2)
      || (a.est_minutes || 99) - (b.est_minutes || 99))[0];
    return {t, why: 'top of today'};
  }
  return null;
}

    if (!d.planned && !d.overload) return '';

    const pct = Math.min(Math.round((d.ratio || 0) * 100), 100);
    const col = d.status === 'over' ? 'var(--accent-hi)' : d.status === 'tight' ? 'var(--focus)' : 'var(--done)';
    return `<div class="card"${d.status === 'over' ? ' style="border-color:var(--accent)"' : ''}><h2>Capacity</h2>

      <div class="ebar" style="margin-top:6px"><div style="width:${pct}%;background:${col}"></div></div>
      ${d.overload ? `<div style="color:var(--accent-hi);font-size:12px;margin-top:6px">⚠ ${esc(d.overload)}</div>` : ''}</div>`;
  }
  const doneT = new Set(S.tasks.filter(isDoneToday).map(t => (t.title || '').toLowerCase()));
  const open = planItems().filter(p => !doneT.has((p.title || '').toLowerCase()));
  const planMin = open.reduce((s, p) => s + (p.est_minutes || 15), 0);
  if (!planMin) return '';
  const n = new Date(); const nowM = n.getHours() * 60 + n.getMinutes();
  const endM = 23 * 60 + 30;
  if (nowM >= endM) return '';
  let evMin = 0;
  allEvents().filter(e => e.date === todayISO() && e.start_time).forEach(e => {
    const [sh, sm] = e.start_time.split(':').map(Number); let s = sh * 60 + sm;
    let en2 = s + 60; if (e.end_time) { const [eh, em] = e.end_time.split(':').map(Number); en2 = eh * 60 + em; }
    s = Math.max(s, nowM); if (en2 > s) evMin += en2 - s;
  });
  const freeMin = Math.max(endM - nowM - evMin, 0);
  if (planMin <= freeMin) return '';

  return `<div class="card" style="border-color:var(--accent)"><b style="color:var(--accent)">⚠ Overplanned</b>

        `<i style="flex:1;height:11px;border-radius:2px;background:${m >= 1 ? `rgba(74,222,128,${Math.min(.18 + m / 60 * .82, 1).toFixed(2)}` + ')' : 'rgba(255,255,255,.04)'}"></i>`).join('')}</div></div>`).join('')}
    <div style="display:flex;margin-top:3px;margin-left:41px">${[0, 6, 12, 18].map(h =>
      `<span class="mono dim" style="font-size:9px;flex:1">${String(h).padStart(2, '0')}</span>`).join('')}</div></div>`;
  // ---- project split ----
  const pk = Object.entries(proj).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const pmax = pk.length ? pk[0][1] : 1;
  const projects = `<div class="card"><h2>Where the minutes went</h2>

      <div style="flex:1;height:10px;background:#12141C;border-radius:5px;overflow:hidden">

        <span class="mono" style="flex:0 0 86px">${hm(s.start)}–${hm(s.end)}</span>

        <span class="dim mono" style="margin-left:auto;flex:0 0 auto">${s.minutes}m${(+s.rate || 1) < 1 ? ' · ⅓' : ''}</span></div>`;

/* task clock-in: ▶ on a task row — same timer, tethered to the task */
async function startTask(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (S._clockBusy) return;
  if (S.focusOpen) {
    if (S.focusOpen.task_id === id) { setView('today'); return; }
    if (!confirm('Already clocked in — close that session and start this task?')) return;
    await clockOut({noFlush: true});
  }
  const energy = CREDIT_RATE[t.energy] ? t.energy : 'LIGHT';
  const wasStatus = t.status;
  if (!t.status || t.status === 'not_started') t.status = 'in_progress';
  toast('▶ ' + t.title);
  setView('today');   // land on TODAY immediately; the timer chip appears when the insert returns
  S.lastWrite = Date.now(); S._clockBusy = true;
  // NOTE: supabase-js query builders are thenables with ONLY .then() — no .finally()/.catch().
  // Calling .finally() here threw a TypeError after _clockBusy was set, so the insert never fired and
  // every later ▶ tap was swallowed by the busy guard. Wrap in a real Promise instead.
  let data, error;
  try { ({data, error} = await Promise.resolve(db.from('focus_sessions').insert({energy, task_id: id}).select().single())); }
  catch (e) { error = e; }
  finally { S._clockBusy = false; }
  if (error) { t.status = wasStatus; render(); toast('Start failed: ' + (error.message || error)); return; }
  S.focusOpen = data;
  if (wasStatus !== t.status) db.from('tasks').update({status: 'in_progress'}).eq('id', id).then(() => {});
  render();           // timer chip now live
}
async function clockOut(opts){
  if (!S.focusOpen || S._clockBusy) return;
  S._clockBusy = true; S.lastWrite = Date.now();
  const fo = S.focusOpen;
  S.focusOpen = null; render();   // chip disappears instantly; a second tap can't clock out twice
  let dnsBefore = null;
  try {
  // Read DNS state BEFORE the session ends (the end trigger flips it): were the feeds locked for this timer?
  dnsBefore = await db.rpc('lifeos_dns_status').then(r => r.data || null, () => null);
  if (fo.task_id) {
    // server does the 90%-of-est logic: done + reward, or shrink est and stay open
    const {data, error} = await db.rpc('lifeos_task_clockout', {p_session: fo.id});
    if (error) {
      // never trap the user — end the session anyway (is-null guard: don't
      // re-extend a session the server auto-clockout already closed)
      await db.from('focus_sessions').update({ended_at: new Date().toISOString()}).eq('id', fo.id).is('ended_at', null);
      toast('⏹ clocked out (task update skipped)');
    } else {
      const r = data || {};
      if (r.completed) toast(`⏹ ${r.minutes}m — task done ✓ +5cr${r.parent_confirm ? ' · goal complete? see TODAY' : ''}`);
      else if (r.error) toast(`⏹ ${r.minutes || 0}m — ${r.error}`);
      else toast(`⏹ ${r.minutes}m — ${r.remaining}m left on the task`);
    }
  } else {
    await db.from('focus_sessions').update({ended_at: new Date().toISOString()}).eq('id', fo.id).is('ended_at', null);
    const mins = Math.floor((Date.now() - new Date(fo.started_at).getTime()) / 60000);
    toast(`Clocked out — ${mins} min → ~${Math.floor(mins / (CREDIT_RATE[fo.energy] || CREDIT_RATE.LIGHT) * (+fo.credit_rate || 1))} credits${(+fo.credit_rate || 1) < 1 ? ' (⅓ rate)' : ''}`);
  }
  } catch (e) { toast('clock-out failed: ' + (e.message || e)); S.focusOpen = fo; render(); }
  finally { S._clockBusy = false; }
  await loadAll();   // reconcile (awaited so a task started right after can't be overwritten by this reload)
  if (!(opts && opts.noFlush)) flushPhoneDns(dnsBefore);

/* Feeds stayed dead for minutes after clock-out even though the server cleared NextDNS within seconds:
   NextDNS answers a blocked domain with 0.0.0.0 and iOS caches that for up to 5 min after the LAST
   lookup — and Instagram polls constantly while blocked, so the cache is always fresh. iOS has no DNS
   flush; an Airplane-mode toggle is the one thing that drops it, and a Shortcut can do that. Deep-link
   "LifeOS Unlock" (Airplane on → wait 2 s → Airplane off); x-success brings us back.
   2026-10-05: wait until the server has VERIFIED NextDNS is open (dns-apply reports in_sync and not
   blocked) before toggling — flushing while NextDNS still says 0.0.0.0 just re-caches the block.
   If the new state is still "blocked" (broke / gated), there is nothing to unlock. Opt out:
   localStorage lifeos_unlock_shortcut=off. */
async function flushPhoneDns(st){
  if (!st || !st.enabled || !st.blocked) return;
  if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
  try { if (localStorage.getItem('lifeos_unlock_shortcut') === 'off') return; } catch (_e) {}
  const t0 = Date.now();
  for (let i = 0; i < 20; i++) {                       // up to ~40 s
    const r = await db.rpc('lifeos_dns_status').then(x => x.data || null, () => null);
    if (r && r.wanted) return;                         // still meant to be blocked → nothing to flush
    if (r && !r.blocked && r.in_sync) break;           // NextDNS verified open → safe to flush
    toast('📶 waiting for NextDNS to open… ' + Math.round((Date.now() - t0) / 1000) + 's');
    await new Promise(res => setTimeout(res, 2000));
  }
  runUnlockShortcut();
}
function runUnlockShortcut(){
  const back = encodeURIComponent(location.origin + location.pathname);
  toast('📶 flushing DNS cache so feeds unlock now…');
  setTimeout(() => {
    location.href = 'shortcuts://x-callback-url/run-shortcut?name=' + encodeURIComponent('LifeOS Unlock')
      + '&x-success=' + back + '&x-error=' + back + '&x-cancel=' + back;
  }, 400);
}

});

/* Non-passive touchmove blocker for ALL drags (plan list, grid create, plan
   blocks). Attached ONLY while a drag is actually active — a permanently
   attached non-passive listener routed every touch scroll through the main
   thread and could wedge calendar views unscrollable. Armed at
   drag-activation, disarmed on drag end/cancel. */
const dragBlockTouch = e => e.preventDefault();
let _dragArmTimer = null;
function armDragTouch(){ document.addEventListener('touchmove', dragBlockTouch, {passive: false}); clearTimeout(_dragArmTimer); _dragArmTimer = setTimeout(disarmDragTouch, 10000); }   // 10 s safety net: a lost pointerup must never wedge scrolling
function disarmDragTouch(){ clearTimeout(_dragArmTimer); document.removeEventListener('touchmove', dragBlockTouch); if (PDrag) { PDrag.ghost?.remove(); PDrag = null; document.body.style.userSelect = ''; } }
/* drag-to-reorder with a floating clone that follows the finger */
var PDrag = null;   // var: hoisted, so uiBusy() can read it before this line runs
function planDragStart(e){
  e.preventDefault();
  const row = e.target.closest('[data-pi]'); if (!row) return;
  const r = row.getBoundingClientRect();
  const g = row.cloneNode(true);
  g.style.cssText += ';position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;margin:0;z-index:99;pointer-events:none;background:var(--card);border:1px solid var(--accent);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.55)';
  document.body.appendChild(g);
  PDrag = {from: +row.dataset.pi, ghost: g, x0: e.clientX, y0: e.clientY};
  armDragTouch();   // this drag is active from pointerdown (dedicated ≡ handle)
  document.body.style.userSelect = 'none';
  if (navigator.vibrate) navigator.vibrate(10);
}
document.addEventListener('pointermove', e => {
  if (!PDrag || !S.planEdit) return;
  PDrag.ghost.style.transform = `translate(0px, ${e.clientY - PDrag.y0}px)`;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const row = el && el.closest && el.closest('[data-pi]');
  if (!row) return;
  const to = +row.dataset.pi;
  if (to !== PDrag.from) {
    // move the existing DOM rows instead of rebuilding them: on iOS a rebuilt row under the finger
    // loses the pointerup, PDrag stays set and the touchmove blocker eats every scroll until reload
    const box = document.getElementById('planEditRows');
    const rows = box ? [...box.querySelectorAll('[data-pi]')] : [];
    const fromEl = rows[PDrag.from], toEl = rows[to];
    const [it] = S.planEdit.splice(PDrag.from, 1);
    S.planEdit.splice(to, 0, it);
    if (fromEl && toEl) { if (to > PDrag.from) toEl.after(fromEl); else toEl.before(fromEl); box.querySelectorAll('[data-pi]').forEach((r, i) => r.dataset.pi = i); }
    PDrag.from = to;
  }
});
document.addEventListener('pointerup', () => {
  if (PDrag) {
    PDrag.ghost?.remove(); PDrag = null;
    disarmDragTouch();
    document.body.style.userSelect = '';
    const box = document.getElementById('planEditRows');
    if (box) box.innerHTML = planEditRowsHTML();
  }
});
document.addEventListener('pointercancel', () => {   // without this, a cancelled drag left PDrag set forever → the touchmove blocker ate all scrolling
  if (PDrag) {
    PDrag.ghost?.remove(); PDrag = null;
    disarmDragTouch();
    document.body.style.userSelect = '';
    const box = document.getElementById('planEditRows');
    if (box) box.innerHTML = planEditRowsHTML();
  }
});

function _shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* classify an answer so distractors can be the SAME kind (a year vs a year,
   not a year vs a name) — makes MCQ options non-obvious */
function _ansShape(s){
  s = String(s || '').trim();
  if (/^\W*\d{4}\W*$/.test(s)) return 'year';
  if (/^[\d.,\s%$/x×+-]+$/i.test(s) && /\d/.test(s)) return 'num';
  return s.split(/\s+/).length <= 2 ? 'short' : 'long';
}
/* distractors: prefer same answer-shape, then same category — harder choices */
function _mcqOpts(card){
  const shape = _ansShape(card.back), cat = card.category;
  const norm = x => String(x || '').trim().toLowerCase();
  const seen = new Set([norm(card.back)]);
  const cands = [];
  for (const c of (S.cards || [])) {
    if (c.id === card.id || !c.back) continue;
    const k = norm(c.back); if (seen.has(k)) continue; seen.add(k);
    let score = 0;
    if (_ansShape(c.back) === shape) score += 2;
    if (cat && c.category === cat) score += 1;
    cands.push({ back: c.back, score, r: Math.random() });
  }
  cands.sort((a, b) => b.score - a.score || a.r - b.r);
  const distract = cands.slice(0, 3).map(c => c.back);
  return _shuffle([card.back, ...distract]);
}
function buildWakeQuestions(){
  const pool = (S.cards || []).filter(c => c.back && c.front);
  return _shuffle(pool).slice(0, 7).map(c => {
    const options = _mcqOpts(c);
    return { cardId: c.id, front: c.front, options, answer: options.indexOf(c.back) };
  }).filter(q => q.options.length >= 2);
}

/* ================= VIZ — ring / area / bars / tiles (v5 bevel pass, 2026-10-15) =================
   Pure functions → SVG/HTML strings. No state, no listeners, no geometry contracts.
   ring(pct)   : 270° progress arc with gradient + glow + optional target tick
   area(vals)  : smooth gradient-filled line (sparkline or full chart)
   bars(rows)  : stacked rounded columns
   tile(v,l)   : stat tile  ·  tiles([...]) : grid wrapper                                  */
const VIZ = (() => {
  let n = 0; const uid = () => 'vz' + (++n) + '_' + Math.floor(Math.random() * 1e6).toString(36);
  const f = x => (+x).toFixed(1);

    const sweep = 270, start = 135;                       // open at the bottom, like a dial
    const p = Math.max(0, Math.min(100, +pct || 0)) / 100;
    const C = 2 * Math.PI * r, arc = C * sweep / 360;
    const [c1, c2] = pair(o.color || ['#FF4D42', '#FBBF24']);
    const id = uid();
    const tick = o.target == null ? '' : (() => {
      const a = (start + sweep * (o.target / 100)) * Math.PI / 180;
      const x1 = c + (r - sw / 2 - 3) * Math.cos(a), y1 = c + (r - sw / 2 - 3) * Math.sin(a);
      const x2 = c + (r + sw / 2 + 3) * Math.cos(a), y2 = c + (r + sw / 2 + 3) * Math.sin(a);
      return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round"/>`;
    })();
    const vsize = o.vsize || Math.round(size * 0.3);
    return `<div class="ring" style="width:${size}px;height:${size}px">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
        <defs><linearGradient id="${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
        <circle cx="${c}" cy="${c}" r="${f(r)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${sw}" stroke-linecap="round"

        ${p > 0 ? `<circle cx="${c}" cy="${c}" r="${f(r)}" fill="none" stroke="url(#${id})" stroke-width="${sw}" stroke-linecap="round"

function dayStripHTML(today){

    return `<div class="ds-b ${cls}" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;--c:${color}" title="${esc(title)}" ${extra}>${w > 4 ? esc(title) : ''}</div>`;
  };

    let s = toMin(e.start_time), en = e.end_time ? toMin(e.end_time) : s + 60; if (en <= s) en += 1440;

  }).join('');

  const n = new Date(); let nowM = n.getHours() * 60 + n.getMinutes(); if (nowM < 6 * 60) nowM += 1440;

/* drag the top card: → save · ← pass · ↑ going */
let QD = null;
function qDown(e){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest && e.target.closest('input,textarea,button,select,a,.exscroll')) return;   // typing / scrolling inside a card is not a swipe
  const el = e.currentTarget;
  QD = {el, x: e.clientX, y: e.clientY, moved: false, w: el.offsetWidth, h: el.offsetHeight};
  S.qDrag = true;
  el.classList.remove('snap', 'fly');
  try { el.setPointerCapture(e.pointerId); } catch (_e) {}
}
function qMove(e){
  if (!QD) return;
  const dx = e.clientX - QD.x, dy = e.clientY - QD.y;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) QD.moved = true;
  QD.el.style.transform = `translate(${dx}px,${dy}px) rotate(${dx / 18}deg)`;
  const up = dy < -40 && Math.abs(dx) < Math.abs(dy);
  const set = (sel, v) => { const t = QD.el.querySelector(sel); if (t) t.style.opacity = Math.min(1, Math.max(0, v)); };
  set('.qtag.r', up ? 0 : dx / (QD.w * .3));
  set('.qtag.l', up ? 0 : -dx / (QD.w * .3));
  set('.qtag.u', up ? -dy / (QD.h * .25) : 0);
}
function qUp(e){
  if (!QD) return;
  const d = QD; QD = null; S.qDrag = false;
  const lost = e.type === 'pointercancel' && !e.clientX && !e.clientY;
  const dx = lost ? 0 : e.clientX - d.x, dy = lost ? 0 : e.clientY - d.y;
  const up = dy < -d.h * .25 && Math.abs(dx) < Math.abs(dy);
  const ex = S.view === 'explore';
  if (up && ex) { exploreUp(); }                               // explore: ↑ opens depth, card stays
  else if (up) return questSwipe('up');
  else if (dx > d.w * .3) return ex ? exploreSwipe('right') : questSwipe('right');
  else if (dx < -d.w * .3) return ex ? exploreSwipe('left') : questSwipe('left');
  d.el.classList.add('snap'); d.el.style.transform = '';
  d.el.querySelectorAll('.qtag').forEach(t => { t.style.opacity = 0; });
  if (d.moved) {   // a drag that snapped back must not count as a click on the link under the finger
    const kill = ev => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener('click', kill, {capture: true, once: true});
    setTimeout(() => document.removeEventListener('click', kill, {capture: true}), 120);
  }
  if (S._dirty) renderSoft();
}
document.addEventListener('pointermove', qMove, {passive: true});
document.addEventListener('pointerup', qUp);
document.addEventListener('pointercancel', qUp);
document.addEventListener('keydown', e => {
  if (uiBusy()) return;
  if (S.view === 'explore' && (S.exFeed || []).length) {
    if (e.key === 'ArrowLeft') exploreSwipe('left'); else if (e.key === 'ArrowRight') exploreSwipe('right'); else if (e.key === 'ArrowUp') { e.preventDefault(); exploreUp(); }
    return;
  }
  if (S.view !== 'quests' || !questDeckItems().length) return;
  if (e.key === 'ArrowLeft') questSwipe('left');
  else if (e.key === 'ArrowRight') questSwipe('right');
  else if (e.key === 'ArrowUp') { e.preventDefault(); questSwipe('up'); }
});
async function questSwipe(dir){
  const it = questDeckItems()[0]; if (!it) return;
  const el = document.querySelector('.qcard.top');
  if (el) {
    el.classList.remove('snap'); el.classList.add('fly');
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.transform = dir === 'left' ? `translate(${-w * 1.4}px,40px) rotate(-18deg)` : dir === 'right' ? `translate(${w * 1.4}px,40px) rotate(18deg)` : `translateY(${-h * 1.3}px) scale(.9)`;
    el.style.opacity = '0';
    el.onpointerdown = null;
  }
  // optimistic: the card is gone from the deck now; saved/going lists update in the same frame
  S.qExpand = null;
  if (it.kind === 'q') {
    S.questDeck = (S.questDeck || []).filter(x => x.id !== it.q.id);
    if (dir !== 'left') { it.q.status = dir === 'up' ? 'going' : 'saved'; S.questSaved = [...(S.questSaved || []).filter(x => x.id !== it.q.id), it.q].sort((a, b) => (a.event_date + (a.starts_at || '')).localeCompare(b.event_date + (b.starts_at || ''))); }
  } else {
    S.questCands = (S.questCands || []).filter(x => x.id !== it.s.id);
  }
  S.lastWrite = Date.now();
  setTimeout(() => { if (!uiBusy()) render(); }, 300);
  const {data, error} = it.kind === 'q'
    ? await db.rpc('lifeos_quests_swipe', {p_id: it.q.id, p_dir: dir})
    : await db.rpc('lifeos_quests_source_swipe', {p_id: it.s.id, p_dir: dir === 'left' ? 'left' : 'right'});
  if (error || (data && data.ok === false)) { toast('Swipe failed: ' + (error ? error.message : (data.note || ''))); loadAll(); return; }
  if (it.kind === 'q' && dir === 'up') toast('⚔ ' + questWhen(it.q) + ' — on your calendar');
  if (it.kind === 'src' && dir !== 'left') toast('Following ' + (it.s.handle || it.s.label));
}
/* saved-list actions: ↑ going (adds the CAL block) · ✕ drop */
async function questAct(id, dir){
  const q = (S.questSaved || []).find(x => x.id === id); if (!q) return;
  if (dir === 'left') S.questSaved = S.questSaved.filter(x => x.id !== id); else q.status = 'going';
  S.lastWrite = Date.now();
  render();
  const {data, error} = await db.rpc('lifeos_quests_swipe', {p_id: id, p_dir: dir});
  if (error || (data && data.ok === false)) { toast('Save failed: ' + (error ? error.message : (data.note || ''))); loadAll(); }
}

  if (c.kind === 'curio') {
    const topic = c.topic + (c.tags && c.tags.length ? ' · ' + c.tags.slice(0, 2).join(', ') : '');
    if (back) {
      const rev = S.exReveal === c.id;
      inner = kindLine(topic) + `<div class="exhook">${esc(c.hook)}</div>` +
        (rev ? `<div class="exscroll">${exMd(c.body)}</div><div class="exchoice"><button class="no" onclick="exBack(${c.id},'forgot')">NOPE</button><button class="yes" onclick="exBack(${c.id},'remember')">GOT IT</button></div>`
             : `<div class="dim" style="font-size:13px">Say the why out loud first.</div><div class="exchoice"><button onclick="S.exReveal=${c.id};render()">REVEAL</button></div>`) + src;
    } else {
      inner = kindLine(topic, open ? '' : '<span class="dim">↑ depth</span>') + `<div class="exhook">${esc(c.hook)}</div>` +
        (open ? `<div class="exscroll">${exMd(c.body)}</div>` : '') + src;
    }
  } else if (c.kind === 'guess') {
    const r = S.exResult && S.exResult.id === c.id ? S.exResult : null;
    const g = S.exGuess && S.exGuess.id === c.id ? S.exGuess.v : null;
    const lo = Number(c.guess_min), hi = Number(c.guess_max), logS = lo > 0 && hi / lo >= 50;
    const sv = g != null && g > 0 ? (logS ? Math.log(g / lo) / Math.log(hi / lo) : (g - lo) / (hi - lo)) * 1000 : 500;
    inner = kindLine(c.topic + ' · guess') + `<div class="exhook">${esc(c.hook)}</div>` +
      (r ? `<div class="exres ${r.pts >= 70 ? 'good' : r.pts >= 35 ? 'ok' : 'bad'}"><div class="big">${exNum(r.answer)} <span style="font-size:13px;font-weight:500;color:var(--dim)">${esc(c.answer_unit || '')}</span></div><div class="pts">you said ${exNum(r.guess)} · ${r.pts} pts${r.log_err != null ? ' · off by ' + Math.pow(10, r.log_err).toFixed(1) + '×' : ''}</div></div><div class="exscroll">${exMd(c.body)}</div>`
         : `<div class="exrow"><input type="number" id="exg-${c.id}" inputmode="decimal" placeholder="your guess" value="${g != null ? g : ''}" oninput="exSetGuess(${c.id}, this.value)"><span class="unit">${esc(c.answer_unit || '')}</span><button class="exgo" onclick="exLock(${c.id})">LOCK IN</button></div>
            <input class="exslide" type="range" min="0" max="1000" value="${Math.round(Math.max(0, Math.min(1000, sv)))}" oninput="exSlide(${c.id}, this.value, ${lo}, ${hi}, ${logS})">`) + src;
  } else {
    const a = S.exAnswer && S.exAnswer.id === c.id ? S.exAnswer : null;
    inner = kindLine((c.track || 'lesson') + ' · ' + (c.lesson_no || '')) + `<div class="exhook">${esc(c.hook)}</div>` +
      `<div class="exscroll">${exMd(c.body)}<p><strong>${esc(c.question || '')}</strong></p>` +
      (a && a.verdict ? `<div class="exres"><div class="exverdict ${a.verdict}">${a.verdict}</div><div style="font-size:13px;margin-top:4px">${esc(a.feedback || '')}</div></div>`
       : `<textarea class="exans" id="exa-${c.id}" placeholder="Your answer, in your own words…" oninput="S.exBusy=true"${a && a.grading ? ' disabled' : ''}>${esc(a ? a.text || '' : '')}</textarea><div class="exrow" style="margin-top:8px;justify-content:flex-end"><button class="exgo" onclick="exAnswer(${c.id})"${a && a.grading ? ' disabled' : ''}>${a && a.grading ? 'GRADING…' : 'ANSWER'}</button></div>`) +
      `</div>` + src;
  }
  return `<div class="qcard ex ${c.kind} noimg ${cls}" ${grab}><div class="qbody">${inner}</div>
    <div class="qtag r">${back ? 'GOT IT' : c.kind === 'curio' ? 'MORE' : 'KEEP'}</div><div class="qtag l">${back ? 'NOPE' : 'PASS'}</div>${c.kind === 'curio' && !back && !open ? '<div class="qtag u d">DEPTH</div>' : ''}</div>`;
}
function rExplore(){

function exSetGuess(id, v){ S.exGuess = {id, v: v === '' ? null : Number(v)}; S.exBusy = true; }
function exSlide(id, pos, lo, hi, logS){
  const p = Number(pos) / 1000; let v = logS ? lo * Math.pow(hi / lo, p) : lo + (hi - lo) * p;
  v = Math.abs(v) >= 100 ? Math.round(v) : +v.toPrecision(3);
  S.exGuess = {id, v}; S.exBusy = true;
  const inp = document.getElementById('exg-' + id); if (inp) inp.value = v;
}
async function exLock(id){
  const c = exTop(); if (!c || c.id !== id) return;
  const g = S.exGuess && S.exGuess.id === id ? S.exGuess.v : null;
  if (g == null || !isFinite(g)) { toast('Type or slide a guess first'); return; }
  S.lastWrite = Date.now();
  const {data, error} = await db.rpc('lifeos_explore_act', {p_id: id, p_action: 'guess', p_value: {guess: g}});
  if (error || !data || data.ok === false) { toast('Save failed: ' + (error ? error.message : '')); return; }
  S.exResult = Object.assign({id}, data); S.exBusy = false;
  if (c.mode === 'comeback') S.exBackAuto = data.pts >= 70 ? 'remember' : 'forgot';
  if (data.pts >= 50) bumpCardsCorrect();
  render();
}
async function exAnswer(id){
  const c = exTop(); if (!c || c.id !== id) return;
  const ta = document.getElementById('exa-' + id); const text = (ta ? ta.value : '').trim();
  if (!text) { toast('Write an answer first'); return; }
  S.exAnswer = {id, text, grading: true}; render();
  let verdict = 'partial', feedback = '';
  try {
    const {data:{session}} = await db.auth.getSession();
    const r = await fetch(SB_URL + '/functions/v1/grade', {method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token},
      body: JSON.stringify({front: c.question, back: c.answer_text, answer: text})});
    const d = await r.json(); verdict = d.verdict || 'partial'; feedback = d.feedback || '';
  } catch (e) { feedback = 'Grader unreachable — compare with the key: ' + (c.answer_text || ''); }
  S.exAnswer = {id, text, verdict, feedback}; S.exBusy = false;
  S.lastWrite = Date.now();
  db.rpc('lifeos_explore_act', {p_id: id, p_action: 'answer', p_value: {text, verdict, feedback}}).then(({error}) => { if (error) toast('Save failed: ' + error.message); });
  if (verdict !== 'wrong') bumpCardsCorrect();
  render();
}
function exploreUp(){
  const c = exTop(); if (!c) return;
  if (c.kind === 'curio' && c.mode !== 'comeback') {
    if (S.exOpen !== c.id) { S.exOpen = c.id; S.lastWrite = Date.now(); db.rpc('lifeos_explore_act', {p_id: c.id, p_action: 'up'}); bumpCardsCorrect(); }
    render();
  } else if (c.kind === 'curio') { S.exReveal = c.id; render(); }
}
function exFly(dir){
  const el = document.querySelector('.qcard.top'); if (!el) return;
  el.classList.remove('snap'); el.classList.add('fly');
  const w = el.offsetWidth;
  el.style.transform = dir === 'left' ? `translate(${-w * 1.4}px,40px) rotate(-18deg)` : `translate(${w * 1.4}px,40px) rotate(18deg)`;
  el.style.opacity = '0'; el.onpointerdown = null;
}
async function exBack(id, action){   // comeback curio after reveal: GOT IT / NOPE
  const c = exTop(); if (!c || c.id !== id) return;
  exFly(action === 'remember' ? 'right' : 'left');
  S.exFeed = (S.exFeed || []).filter(x => x.id !== id); S.exReveal = null;
  S.lastWrite = Date.now(); setTimeout(() => { if (!uiBusy()) render(); }, 300);
  const {error} = await db.rpc('lifeos_explore_act', {p_id: id, p_action: action});
  if (error) { toast('Save failed: ' + error.message); return; }
  if (action === 'remember') bumpCardsCorrect();
  exRefill();
}
async function exploreSwipe(dir){
  const c = exTop(); if (!c) return;
  let action = dir;
  if (c.mode === 'comeback') action = (c.kind === 'guess' && S.exBackAuto) ? S.exBackAuto : (dir === 'right' ? 'remember' : 'forgot');
  exFly(dir);
  S.exFeed = (S.exFeed || []).filter(x => x.id !== c.id);
  S.exOpen = null; S.exReveal = null; S.exBackAuto = null; S.exBusy = false;
  S.lastWrite = Date.now(); setTimeout(() => { if (!uiBusy()) render(); }, 300);
  const {error} = await db.rpc('lifeos_explore_act', {p_id: c.id, p_action: action});
  if (error) { toast('Save failed: ' + error.message); loadAll(); return; }
  exRefill();
}
let _exRefill = null;
function exRefill(){   // keep the stack fed without a full loadAll
  if ((S.exFeed || []).length > 4) return;
  clearTimeout(_exRefill);
  _exRefill = setTimeout(async () => {
    const {data} = await db.rpc('lifeos_explore_feed', {p_limit: 20});
    if (Array.isArray(data)) { const have = new Set((S.exFeed || []).map(x => x.id)); S.exFeed = [...(S.exFeed || []), ...data.filter(x => !have.has(x.id))]; }
    const st = await db.rpc('lifeos_explore_stats'); if (st.data) S.exStats = st.data;
    if (!uiBusy() && !S.qDrag) render();
  }, 400);
}

function rBrief(){

/* compact one-day timeline for the BRIEF tab — same tap/drag handlers as CAL */
function briefDayCal(){
  const iso = todayISO();
  allEvents().forEach((e, i) => e._i = i);
  const evs = allEvents().filter(e => e.date === iso).sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));
  const allday = evs.filter(e => !e.start_time), timed = evs.filter(e => e.start_time);
  const H0 = 0, H1 = 24, PPH = 26;   // full 24h; opens scrolled to 6 AM
  const pbs = (S.planBlocks || []).filter(b => b.date === iso && b.kind !== 'call');
  if (!evs.length && !pbs.length) return `<div class="dim" style="font-size:12px;padding:4px 0">No events and nothing planned${gcalConnected() ? '' : ' (connect Google on CAL to see your calendar)'} — open day.</div>`;
  const blocks = timed.map(e => {
    const [sh, sm] = e.start_time.split(':').map(Number);
    let dur = 60;
    if (e.end_time) { const [eh, em] = e.end_time.split(':').map(Number); dur = Math.max(30, (eh * 60 + em) - (sh * 60 + sm)); }
    const top = Math.max(0, ((sh - H0) * 60 + sm) * (PPH / 60));
    const h = Math.max(14, dur * (PPH / 60));
    return `<div class="evblk${e.source === 'work' ? ' work' : ''}" style="top:${top.toFixed(0)}px;height:${h.toFixed(0)}px;cursor:pointer;font-size:10px" onclick="event.stopPropagation();openEv(${e._i})"><b>${esc(e.start_time)}</b> ${esc(e.title)}</div>`;
  }).join('');
  const rail = [...Array(H1 - H0)].map((_, i) => `<div class="hrow" style="top:${i * PPH}px"><span>${hourLabel(H0 + i).replace(' ', '')}</span></div>`).join('');
  const nowLine = (() => {
    const n = new Date(); const mins = (n.getHours() - H0) * 60 + n.getMinutes();
    return (mins > 0 && mins < (H1 - H0) * 60) ? `<div class="nowline" style="top:${(mins * PPH / 60).toFixed(0)}px"></div>` : '';
  })();
  return allday.map(e => `<div class="evrow" style="cursor:pointer" onclick="openEv(${e._i})"><span class="mono">all-day</span><span>${esc(e.title)}</span></div>`).join('') +
    `<div class="gridwrap" id="gridScroll" data-h6="${6 * PPH}" onscroll="S._gsPos=this.scrollTop;S._gsAt=Date.now()">
      <div class="daygrid" style="height:${(H1 - H0) * PPH}px;position:relative" onclick="dayGridTap(event, '${iso}', ${PPH})" onpointerdown="gridPressStart(event, '${iso}', ${PPH}, ${H0})">${rail}${blocks}${planBlockDivs(iso, H0, PPH, 'day')}${nowLine}</div></div>
    <div class="dim mono" style="font-size:10px;margin-top:4px">solid = calendar · dashed 💡 = the AI's plan (hold & drag to move) · 📌 = locked by you</div>`;
}

/* HER wall clock: the whole tab is laid out on Asia/Taipei days (fixed UTC+8,
   no DST), exactly like TimeTree shows her. Shift the epoch +8h and read UTC
   fields. Rendering in viewer-local time shifted her morning events onto the
   previous ET day — they looked "missing". */
const TPE_MS = 8 * 3600000;
const tpeWall = ts => new Date(ts + TPE_MS);              // wall-clock via getUTC*
const w2iso = w => w.toISOString().slice(0, 10);
const tpeTodayISO = () => w2iso(tpeWall(Date.now()));
const tpeNowMins = () => { const w = tpeWall(Date.now()); return w.getUTCHours() * 60 + w.getUTCMinutes(); };
/* your-time label for a segment: "11 PM" (+ "Jul 24" when it's a different local day than her date) */
function yourTimeLabel(ts0, herIso){
  if (!ts0) return '';
  const d = new Date(ts0);
  const t = d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
  const sameDay = d.toLocaleDateString('sv-SE') === herIso;
  return t + (sameDay ? '' : ' ' + d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}));
}
/* map timetree_events -> {iso: [{date,start_time,end_time,title,ts0,ts1}]} (all-day expanded across its range) */
function ttEvByDay(){
  const map = {};
  const push = (iso, ev) => { if (iso) (map[iso] = map[iso] || []).push(ev); };
  (S.ttEvents || []).forEach(e => {
    const title = e.title || '(untitled)';
    if (e.all_day || (!e.start_ts && e.start_date)) {
      const s = e.start_date; if (!s) return;
      const startD = fromISO(s), endD = e.end_date ? fromISO(e.end_date) : null;
      if (!endD || endD <= startD) { push(s, {date:s, start_time:null, end_time:null, title}); }
      else { for (let d = new Date(startD); d < endD; d.setDate(d.getDate()+1)) {   // DTEND is exclusive for all-day
        const iso = d.toLocaleDateString('sv-SE'); push(iso, {date:iso, start_time:null, end_time:null, title}); } }
    } else if (e.start_ts) {
      const hm = w => w.toISOString().slice(11, 16);       // her wall-clock HH:MM
      const t0 = +new Date(e.start_ts);
      const t1 = e.end_ts ? +new Date(e.end_ts) : t0 + 3600000;
      const s = tpeWall(t0), en = tpeWall(t1);
      const sIso = w2iso(s), eIso = w2iso(en);
      if (sIso === eIso) {
        push(sIso, {date:sIso, start_time:hm(s), end_time:hm(en), title, ts0:t0, ts1:t1});
      } else {
        // spans her midnight / multiple days -> split into per-day segments
        push(sIso, {date:sIso, start_time:hm(s), end_time:'24:00', title, ts0:t0, ts1:t1});
        let cur = new Date(Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate() + 1));
        const endDay = new Date(Date.UTC(en.getUTCFullYear(), en.getUTCMonth(), en.getUTCDate()));
        while (cur < endDay) { const i2 = w2iso(cur); push(i2, {date:i2, start_time:'00:00', end_time:'24:00', title, ts0:t0, ts1:t1}); cur.setUTCDate(cur.getUTCDate() + 1); }
        if (en.getUTCHours() * 60 + en.getUTCMinutes() > 0) push(eIso, {date:eIso, start_time:'00:00', end_time:hm(en), title, ts0:t0, ts1:t1});
      }
    }
  });
  return map;
}

  });
  let cells = '';

  }
  return `<div class="card"><div class="cal-g">${['M','T','W','T','F','S','S'].map(d => `<span class="dow">${d}</span>`).join('')}${cells}</div>

}

async function doWhatIf(){
  const el = document.getElementById('whatifText');
  const text = (el?.value || '').trim(); if (!text) return;
  S.whatIfQ = text;
  S.whatIfBusy = true; render();
  try {
    const {data: {session}} = await db.auth.getSession();
    const r = await fetch(SB_URL + '/functions/v1/simulate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token},
      body: JSON.stringify({text}),
    });
    S.whatIf = await r.json();
    if (!r.ok && !S.whatIf.error) S.whatIf = {error: 'HTTP ' + r.status};
  } catch (e) { S.whatIf = {error: e.message}; }
  S.whatIfBusy = false; render();
}

async function createExperiment(){
  const g = id => document.getElementById(id)?.value?.trim() || '';
  const name = g('x-name'); if (!name) { toast('name it first'); return; }
  const kind = g('x-kind') || 'note';
  let intervention;
  if (kind === 'setting') {
    if (!g('x-key') || !g('x-on') || !g('x-off')) { toast('setting experiments need key + both values'); return; }
    intervention = {key: g('x-key'), on_value: g('x-on'), off_value: g('x-off')};
  } else {
    if (!g('x-onnote')) { toast('describe the ON-day behavior'); return; }
    intervention = {on_note: g('x-onnote'), off_note: g('x-offnote') || null};
  }
  S.lastWrite = Date.now();
  const {error} = await db.from('experiments').insert({
    name, hypothesis: g('x-hyp') || null, kind, intervention,
    metric: g('x-metric') || 'score', min_days: parseInt(g('x-days')) || 14,
  });
  if (error) { toast('⚠ ' + error.message); return; }
  S.expForm = false;
  toast('🧪 running — first arm assigns by 6 AM');
  loadAll();
}
async function stopExperiment(id){

  const {data, error} = await db.rpc('lifeos_experiment_stop', {p_id: id});
  toast(error ? '⚠ ' + error.message : 'stopped');
  loadAll();
}
function rTrends(){
  const logs = [...(S.logs || [])].reverse(); // chronological
  const W = 560, H = 150, P = 10;
  // score line — last 30 scored (non-rest) days
  const pts = logs.filter(l => l.score != null && !l.rest_day).slice(-30);
  const line = pts.map((l, i) => ({
    x: P + i * (W - 2*P) / Math.max(pts.length - 1, 1),
    y: H - P - (Math.min(+l.score, 100) / 100) * (H - 2*P),
    hit: l.streak_hit, d: l.date, s: +l.score,
  }));
  const last7 = pts.slice(-7), prev7 = pts.slice(-14, -7);
  const avg = a => a.length ? a.reduce((s, l) => s + Math.min(+l.score, 100), 0) / a.length : null;
  const a7 = avg(last7), a7p = avg(prev7);
  const delta = (a7 != null && a7p != null) ? Math.round(a7 - a7p) : null;
  const hits = pts.filter(l => l.streak_hit).length;
  const scoreSvg = line.length > 1 ? `<div class="chart-head"><span class="hero sm">${Math.round(a7)}</span><span class="dim">7-day avg</span>
      ${delta != null ? `<span class="delta ${delta >= 0 ? 'up' : 'dn'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)}</span>` : ''}
      <span class="dim" style="margin-left:auto">${hits}/${pts.length} hit</span></div>
    <div class="chart">${VIZ.area(pts.map(l => Math.min(+l.score, 100)), {w: W, h: H, min: 0, max: 100, target: 70, targetLabel: '70', color: '#FF4D42',
      dots: (i, v) => pts[i].streak_hit ? '#4ADE80' : 'rgba(255,77,66,.9)', titles: (i, v) => pts[i].date + ': ' + v})}
      <div class="xl"><span>${pts[0].date.slice(5).replace('-', '/')}</span><span>${pts[pts.length - 1].date.slice(5).replace('-', '/')}</span></div></div>`
    : '<div class="empty">Not enough scored days yet — this fills in as you save reflections.</div>';
  // energy minutes done per day — last 14 days, stacked by energy
  const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 13 + i); return d.toLocaleDateString('sv-SE'); });
  const per = days.map(d => {
    const o = {DEEP: 0, FOCUS: 0, LIGHT: 0, PARALLEL: 0};
    S.tasks.forEach(t => { if (t.status === 'done' && localDay(t.completed_at) === d) o[t.energy || 'FOCUS'] += (t.est_minutes || 15); });
    return {d, o, total: Object.values(o).reduce((a, b) => a + b, 0)};
  });
  const tISO = todayISO();

/* --- Google Calendar, server-side (2026-10-05) ---

   every 5 min and pushes app edits from gcal_outbox the moment they are queued. No hourly expiry,

  const {data, error} = await db.functions.invoke('gcal-sync', {body: {action: 'exchange', code, redirect_uri: location.origin + location.pathname}});
  if (error || !data || !data.ok) { toast('Google connect failed: ' + (error?.message || data?.error || 'unknown')); return; }
